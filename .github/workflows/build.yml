# The hub's checks: the plugins' tests on real builds. Nothing is published from a branch; a release
# tag publishes (release.yml).
name: build

on:
  push:
    branches: [main, "*.x"]
    paths-ignore: ["**/*.md", "LICENSE", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - name: Keep test reports of failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
