# Format check, unit and integration tests for every library in the platform. A push to develop is
# checked by snapshot.yml, which then publishes the snapshots; only main releases (release.yml).
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: platform check
    runs-on: ubuntu-latest
    env: # the libraries in their own repositories (settings.gradle)
      GH_PACKAGES_ACTOR: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - name: Keep test reports of failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-platform
          path: |
            **/build/reports/tests/
            **/build/test-results/
