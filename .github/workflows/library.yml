# CI for a platform library in its own repository (config4j, masking4j, …), called from that repository:
#
#   on: { push: { branches: [main, develop] }, pull_request: {} }
#   permissions: { contents: write, packages: write }
#   jobs: { library: { uses: khakimjanovich/platform/.github/workflows/library.yml@develop } }
#
# Every run: ./gradlew check. A push to develop publishes the -SNAPSHOT to GitHub Packages, again on
# every push. A pull request into main must carry a release version that is new, or unchanged since its
# tag; a push to main publishes that release once, tags it v<version> and makes a GitHub release.
# The version is the library's own (`version` in gradle.properties); the hub's catalog pins it.
name: library

on:
  workflow_call:

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    env:
      # uz.khakimjanovich.settings reads the hub's packages with these.
      GH_PACKAGES_ACTOR: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          [ -n "$version" ] || { echo "no version= in gradle.properties" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "$version"

      # main takes releases only, each published once: a released version whose code changed needs a
      # new version.
      - name: Release gate
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          case "$VERSION" in *-SNAPSHOT) echo "main takes releases only: drop -SNAPSHOT from $VERSION" >&2; exit 1 ;; esac
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null && ! git diff --quiet "$TAG" HEAD -- . ':!.github'; then
            echo "$TAG is released, but the library changed since: raise its version" >&2
            exit 1
          fi

      - run: ./gradlew check
        env:
          PLATFORM_SOURCE: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'release' || 'snapshot' }}

      - name: Publish the snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM_SOURCE: snapshot
        run: |
          case "$VERSION" in *-SNAPSHOT) ;; *) echo "develop publishes snapshots only; $VERSION is a release"; exit 0 ;; esac
          ./gradlew publish

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PLATFORM_SOURCE: release
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is out already"
            exit 0
          fi
          ./gradlew publish
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes

      - name: Keep test reports of failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
