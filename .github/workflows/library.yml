# CI for a <lib>4j library in its own repository, called from that repository:
#
#   on: { push: { branches: [main, "*.x"], tags: ["v*"] }, pull_request: {} }
#   permissions: { contents: write, packages: write }
#   jobs: { library: { uses: khakimjanovich/platform/.github/workflows/library.yml@1.x } }
#
# A branch or a pull request: ./gradlew check on the hub release in gradle.properties; nothing is
# published. A tag vX.Y.Z on branch X.x: the release, X.Y.Z, built on releases only
# (PLATFORM_SOURCE=release), published once with a GitHub release. The hub and every library share
# X.Y.Z; gradle.properties keeps the line (version=1.x-SNAPSHOT).
name: library

on:
  workflow_call:

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    env:
      # uz.khakimjanovich.settings reads the hub's packages with these.
      GH_PACKAGES_ACTOR: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the X.x branch a tag must be on
      - uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repository: khakimjanovich/platform
          ref: 1.x
          path: .platform
          sparse-checkout: .github/scripts
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew check
        if: "!startsWith(github.ref, 'refs/tags/')"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PLATFORM_SOURCE: release
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(sed -n 's/^version=//p' gradle.properties)
          version=$(.platform/.github/scripts/release-version.sh "$GITHUB_REF_NAME" "$line")
          ./gradlew check publish -Pversion="$version"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

      - name: Keep test reports of failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
