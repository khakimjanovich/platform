# A pull request into main must be releasable: no -SNAPSHOT version, and no hub change since the tag of
# its version (a released version is never published again). Prints what the merge will release. No
# path filter, so the check always reports and can be required on main.
name: release gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-snapshots:
    name: no snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - run: .github/scripts/no-snapshots.sh
      - name: Release plan
        run: |
          tag=$(.github/scripts/release-plan.sh)
          echo "${tag:-nothing to release}"
