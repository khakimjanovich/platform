# A merge to main that raises the catalog's platform version publishes every library, the build
# plugins and the version catalog to GitHub Packages, tags platform-v<version> and makes a release.
name: release

on:
  push:
    branches: [main]
    paths: [gradle/libs.versions.toml]

permissions:
  contents: write # the tag and the GitHub release
  packages: write # the libraries, plugins and catalog

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        # A catalog change that keeps the version (a dependency bump) releases nothing.
        run: |
          tag="platform-v$(sed -n 's/^platform = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is out already"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check publish && ./gradlew -p build-logic publish
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=; case "$TAG" in *-*-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes $prerelease
