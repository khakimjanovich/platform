# A tag platform-v<version> publishes the version catalog to GitHub Packages and makes a release.
# The tag must equal the catalog's ecom-platform version.
name: release

on:
  push:
    tags: ['platform-v*']

permissions:
  contents: write # the GitHub release
  packages: write # the catalog

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the catalog version
        run: |
          version=$(sed -n 's/^ecom-platform = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml)
          if [ "$GITHUB_REF_NAME" != "platform-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but gradle/libs.versions.toml says ecom-platform = $version."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check :versioning:publish
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          $(case "$GITHUB_REF_NAME" in *-*-*) echo --prerelease;; esac)
