# A merge to main that raises a version in the catalog publishes just that artifact to GitHub Packages
# and tags it: a library or build-logic `platform-<name>` as `<name>-v<version>`, the hub catalog
# `platform` as `platform-v<version>` with a GitHub release. A dependency bump that raises nothing
# releases nothing (.github/scripts/unreleased.sh decides).
name: release

on:
  push:
    branches: [main]
    paths: [gradle/libs.versions.toml]

permissions:
  contents: write # the tags and the hub's GitHub release
  packages: write # the libraries, plugins and catalog

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      unreleased: ${{ steps.plan.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/no-snapshots.sh # the release gate let one through: stop here
      - id: plan
        run: |
          unreleased=$(.github/scripts/unreleased.sh)
          echo "${unreleased:-nothing to release}"
          { echo 'unreleased<<EOF'; echo "$unreleased"; echo EOF; } >> "$GITHUB_OUTPUT"

  release:
    name: release
    needs: plan
    if: needs.plan.outputs.unreleased != ''
    runs-on: ubuntu-latest
    env:
      UNRELEASED: ${{ needs.plan.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      # In catalog order, the hub last: each line is a tag and the Gradle arguments that publish it.
      - name: Publish and tag
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r tag args; do
            ./gradlew $args < /dev/null # Gradle reads stdin; keep it off the list
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            case "$tag" in platform-v*)
              prerelease=; case "$tag" in *-*-*) prerelease=--prerelease ;; esac
              gh release create "$tag" --target "$GITHUB_SHA" --generate-notes $prerelease ;;
            esac
          done <<< "$UNRELEASED"
