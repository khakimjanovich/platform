# A tag vX.Y.Z on branch X.x releases the hub: the catalog and both plugin artifacts at X.Y.Z, once,
# with a GitHub release. The catalog it publishes must hold no -SNAPSHOT version.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the X.x branch the tag must be on
      - id: version
        run: |
          line=$(sed -n 's/^platform = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml)
          echo "version=$(.github/scripts/release-version.sh "$GITHUB_REF_NAME" "$line")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check :version-catalog:generateCatalogAsToml -PreleaseVersion=${{ steps.version.outputs.version }}
      - name: No snapshot in the catalog
        run: |
          if grep -n 'SNAPSHOT' version-catalog/build/version-catalog/libs.versions.toml; then
            echo "a release catalog takes releases only" >&2
            exit 1
          fi
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew publish -PreleaseVersion=${{ steps.version.outputs.version }}
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
