# A merge to main releases the hub: the catalog and both plugin artifacts at the catalog's `platform`
# version, once, tagged v<version> with a GitHub release. It fails, publishing nothing, on a -SNAPSHOT
# version or on a hub changed since the tag of its version (.github/scripts). Snapshots come from
# develop (snapshot.yml).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write # the tag and the GitHub release
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - run: .github/scripts/no-snapshots.sh
      - id: plan
        run: |
          tag=$(.github/scripts/release-plan.sh)
          echo "${tag:-nothing to release}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.tag != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - if: steps.plan.outputs.tag != ''
        uses: gradle/actions/setup-gradle@v6
      - if: steps.plan.outputs.tag != ''
        run: ./gradlew check
      - name: Publish and tag
        if: steps.plan.outputs.tag != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew publish
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
