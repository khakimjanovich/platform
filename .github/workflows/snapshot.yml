# Every push to develop: the checks, then every -SNAPSHOT artifact, the build plugins and the catalog
# to GitHub Packages (./gradlew publishSnapshots). The same snapshot version is published again on each
# push and consumers get the newest build. Released versions are never touched here; only main
# releases (release.yml).
name: snapshot

on:
  push:
    branches: [develop]
    paths-ignore: ["**/*.md", "LICENSE", "docs/**"]

permissions:
  contents: read
  packages: write # the snapshots

concurrency:
  group: snapshot
  cancel-in-progress: true # the newest push wins

jobs:
  snapshot:
    name: snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - run: ./gradlew publishSnapshots
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep test reports of failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-snapshot
          path: |
            **/build/reports/tests/
            **/build/test-results/
