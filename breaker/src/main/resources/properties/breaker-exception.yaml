# Errors the breaker library returns: HTTP status, title and message in English, Russian and Uzbek.
platform:
  error:
    codes:
      BREAKER_OPEN:
        http-code: 503
        title: breaker-open
        is-loggable: true
        message-en: "The downstream service is temporarily unavailable."
        message-ru: "Внешний сервис временно недоступен."
        message-uz: "Tashqi xizmat vaqtincha ishlamayapti."
