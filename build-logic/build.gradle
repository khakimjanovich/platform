// The convention plugins, published with the libraries: services apply platform.java,
// platform.library, platform.module and platform.integration-test by id and platform version.
plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

group = 'uz.khakimjanovich.platform'
version = libs.versions.platform.get()

// Only the release workflow publishes. Credentials are the Gradle properties
// githubPackagesUsername and githubPackagesPassword; without them `publish` fails.
publishing {
    repositories {
        maven {
            name = 'githubPackages'
            url = 'https://maven.pkg.github.com/khakimjanovich/platform'
            credentials(PasswordCredentials)
        }
    }
}

dependencies {
    implementation libs.spotless.gradle
    implementation libs.errorprone.gradle
    implementation libs.archunit // verifyArchitecture runs the shared rules on every project's classes

    // The plugins tested on real builds (Gradle TestKit).
    testImplementation platform(libs.spring.boot.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The fixture builds read the same catalog.
    systemProperty 'catalog', file('../gradle/libs.versions.toml').absolutePath
    inputs.file('../gradle/libs.versions.toml')
}
