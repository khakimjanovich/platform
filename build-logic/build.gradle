plugins {
    id 'groovy-gradle-plugin'
}

// The plugins these conventions apply: Spotless and OpenAPI Generator from Maven Central, Error
// Prone's only from the Gradle Plugin Portal.
repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation libs.spotless.gradle
    implementation libs.openapi.generator.gradle
    implementation libs.errorprone.gradle

    // The plugins tested on real builds (Gradle TestKit).
    testImplementation platform(libs.spring.boot.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The fixture builds read the same catalog as every ecom build.
    systemProperty 'catalog', file('../gradle/libs.versions.toml').absolutePath
    systemProperty 'sharedProblem', file('../openapi/common/problem-v1.yaml').absolutePath
    inputs.dir('../openapi/common')
}
