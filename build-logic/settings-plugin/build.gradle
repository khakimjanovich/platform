// platform.settings: where a build takes the platform from (local, snapshot or release).
plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'uz.khakimjanovich.platform'
version = libs.versions.platform.build.get()

gradlePlugin {
    plugins {
        settings {
            id = 'platform.settings'
            implementationClass = 'uz.khakimjanovich.platform.buildlogic.PlatformSettingsPlugin'
        }
    }
}

dependencies {
    testImplementation platform(libs.spring.boot.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
