// An API contract: `<name>-api` holds `src/main/openapi/<name>-v1.yaml`; Spring server interfaces
// and models are generated into build/ and published in the jar, never into source. The spec ships
// in the jar too, so Swagger UI shows exactly what we wrote. With `contract { client = true }` the
// jar also holds `@HttpExchange` client interfaces, named `<Tag>Client` so they never share a simple
// name with the `<Tag>Api` server interfaces.
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask
import uz.heeypay.ecom.contract.OpenApiContractExtension

plugins {
    id 'ecom.library'
    id 'org.openapi.generator'
}

def libs = rootProject.extensions.getByType(VersionCatalogsExtension).named('libs')
def lib = { String alias -> libs.findLibrary(alias).get() }

def contract = extensions.create('contract', OpenApiContractExtension)
contract.client.convention(false)
contract.useResponseEntity.convention(true)
// Every contract answers with the one shared Problem, which is Spring's own ProblemDetail; its
// entries are ProblemDetail properties, never classes of their own.
contract.schemaMappings.convention([
    Problem          : 'org.springframework.http.ProblemDetail',
    ProblemFieldError: 'java.util.Map',
    ProblemSubError  : 'java.util.Map',
])

def name = project.name - '-api'
def basePackage = "uz.heeypay.ecom.${name.replace('-', '')}.api"
def spec = "$projectDir/src/main/openapi/$name-v1.yaml"
// The problem detail and error responses every contract shares, referred to by relative path.
def sharedDir = "$projectDir/../common"
def sharedPrefix = '../../../../common/'
def generatedDir = layout.buildDirectory.dir('generated/openapi')
def generatedClientDir = layout.buildDirectory.dir('generated/openapi-client')

dependencies {
    api platform(lib('spring-boot-bom'))
    api lib('spring-webmvc')
    api lib('jakarta-validation')
    api lib('jakarta-annotation')
    // Generated models need only the annotations Jackson 2 and 3 share; the app runs Jackson 3.
    api lib('jackson-annotations')
    // `uniqueItems` arrays get Jackson 2's @JsonDeserialize(as = LinkedHashSet), which must compile;
    // Jackson 3 never reads it, so it stays off the jar's classpath.
    compileOnly lib('jackson-databind')
    compileOnly lib('jakarta-servlet') // provided by the app's web server
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = spec
    outputDir = generatedDir.map { it.asFile.path }
    apiPackage = basePackage
    modelPackage = "${basePackage}.model"
    configOptions = [
        interfaceOnly       : 'true',
        useSpringBoot3      : 'true',
        useJakartaEe        : 'true',
        useTags             : 'true',
        skipDefaultInterface: 'true',
        openApiNullable     : 'false',
        documentationProvider: 'none',
        annotationLibrary   : 'none',
    ]
    schemaMappings = contract.schemaMappings
    cleanupOutput = true // nothing a previous spec generated survives
}

// Client interfaces only: the models come from the server generation above.
def openApiGenerateClient = tasks.register('openApiGenerateClient', GenerateTask) {
    onlyIf { contract.client.get() }
    generatorName = 'spring'
    library = 'spring-http-interface'
    inputSpec = spec
    outputDir = generatedClientDir.map { it.asFile.path }
    apiPackage = "${basePackage}.client"
    apiNameSuffix = 'Client'
    modelPackage = "${basePackage}.model"
    globalProperties = [apis: '']
    schemaMappings = contract.schemaMappings
    cleanupOutput = true
    // Read when the task runs, after the contract's own `contract { }` block.
    configOptions = contract.useResponseEntity.map { useResponseEntity ->
        [
            useJakartaEe         : 'true',
            useTags              : 'true',
            useBeanValidation    : 'false',
            openApiNullable      : 'false',
            documentationProvider: 'none',
            annotationLibrary    : 'none',
            useResponseEntity    : useResponseEntity.toString(),
        ]
    }
}

// inputSpec is a plain string to the generator: declare the file, so an edited spec regenerates
// instead of being served from the build cache.
tasks.named('openApiGenerate') {
    inputs.file(spec).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(sharedDir).withPathSensitivity(PathSensitivity.RELATIVE)
}
openApiGenerateClient.configure {
    inputs.file(spec).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(sharedDir).withPathSensitivity(PathSensitivity.RELATIVE)
}

sourceSets.main.java.srcDir(generatedDir.map { it.dir('src/main/java') })
sourceSets.main.java.srcDir(generatedClientDir.map { it.dir('src/main/java') })
tasks.named('compileJava') { dependsOn 'openApiGenerate', openApiGenerateClient }
tasks.named('sourcesJar') { dependsOn 'openApiGenerate', openApiGenerateClient }
// Swagger UI reads the spec at /openapi/<name>-v1.yaml, so the shared file goes beside it and the
// spec's references point there.
tasks.named('processResources', ProcessResources) {
    from('src/main/openapi') {
        into 'static/openapi'
        filter { String line -> line.replace(sharedPrefix, '') }
    }
    from(sharedDir) { into 'static/openapi' }
}
