// Integration tests live in src/integrationTest (*IT), run against real infrastructure, and are part of `check`.
plugins {
    id 'java'
}

def integrationTest = sourceSets.create('integrationTest') {
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
}
configurations.integrationTestImplementation.extendsFrom(configurations.implementation, configurations.testImplementation)
configurations.integrationTestRuntimeOnly.extendsFrom(configurations.runtimeOnly, configurations.testRuntimeOnly)

def integrationTestTask = tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against real infrastructure (Testcontainers).'
    group = 'verification'
    testClassesDirs = integrationTest.output.classesDirs
    classpath = integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}
tasks.named('check') { dependsOn integrationTestTask }
