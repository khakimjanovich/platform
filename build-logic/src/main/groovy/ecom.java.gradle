// Every Java build: Java from the catalog, the Spring Boot BOM, Lombok, JUnit 5,
// parameter names for Spring binding, one code format checked by `check`, and null-safety:
// Error Prone with NullAway checks every @NullMarked package (JSpecify), as a warning here and an
// error in platform libraries (ecom.library). Generated code and tests are not checked.
import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java-library'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
}

def libs = rootProject.extensions.getByType(VersionCatalogsExtension).named('libs')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.findVersion('java').get().requiredVersion)
}

// Keep parameter names so Spring can bind query and request parameters by name.
tasks.withType(JavaCompile).configureEach { options.compilerArgs.add('-parameters') }

dependencies {
    implementation platform(libs.findLibrary('spring-boot-bom').get())
    testImplementation platform(libs.findLibrary('spring-boot-bom').get())
    testImplementation libs.findLibrary('starter-test').get()
    testRuntimeOnly libs.findLibrary('junit-launcher').get()
    compileOnly libs.findLibrary('lombok').get()
    annotationProcessor libs.findLibrary('lombok').get()
    implementation libs.findLibrary('jspecify').get()
    errorprone libs.findLibrary('errorprone-core').get()
    errorprone libs.findLibrary('nullaway').get()
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        // Null-safety is what this build checks; Error Prone's other checks stay off.
        disableAllChecks = true
        check('NullAway', CheckSeverity.WARN)
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
        excludedPaths = '.*/build/generated/.*'
    }
}
// Tests may pass null on purpose; only production code is checked.
tasks.matching { it.name ==~ /compile(Test|IntegrationTest|TestFixtures)Java/ }.configureEach {
    options.errorprone.enabled = false
}

// Every service requires these (observability); tests send to a local collector, if one runs.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    environment 'TRACING_SAMPLING', '1.0'
    environment 'OTLP_TRACES_ENDPOINT', 'http://localhost:4318/v1/traces'
    environment 'OTLP_METRICS_ENDPOINT', 'http://localhost:4318/v1/metrics'
    environment 'OTLP_LOGS_ENDPOINT', 'http://localhost:4318/v1/logs'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat(libs.findVersion('google-java-format').get().requiredVersion)
    }
}
