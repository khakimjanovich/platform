// A platform library, with sources, under the platform's group and version: the coordinates the app and
// the adapters depend on, which Gradle maps to this project when they include the platform build.
plugins {
    id 'ecom.java'
    id 'maven-publish'
}

def libs = rootProject.extensions.getByType(VersionCatalogsExtension).named('libs')

group = 'uz.heeypay.ecom'
version = libs.findVersion('ecom-platform').get().requiredVersion

java { withSourcesJar() }

// META-INF/spring-configuration-metadata.json in every jar: IDE completion and docs for every property.
dependencies {
    annotationProcessor platform(libs.findLibrary('spring-boot-bom').get())
    annotationProcessor libs.findLibrary('spring-boot-configuration-processor').get()
}

publishing {
    publications {
        library(MavenPublication) { from components.java }
    }
}
