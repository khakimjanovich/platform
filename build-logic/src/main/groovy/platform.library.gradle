// A platform library, with sources, under the platform's group and version: the coordinates the app and
// the adapters depend on, which Gradle maps to this project when they include the platform build.
plugins {
    id 'platform.java'
    id 'maven-publish'
}

def libs = rootProject.extensions.getByType(VersionCatalogsExtension).named('libs')

group = 'uz.khakimjanovich.platform'
version = libs.findVersion('platform').get().requiredVersion

java { withSourcesJar() }

// A library is one flat package, its public API: verifyArchitecture leaves out a service's package rules.
tasks.named('verifyArchitecture') { serviceLayout.set(false) }

// A library is where the platform declares what it wraps (Redis, Vault, Hikari…): verifyPlatformFirst is for its users.
tasks.named('verifyPlatformFirst') { platformLibrary.set(true) }

// Never incremental: the configuration processor writes the metadata only from the sources it
// compiles, so recompiling one class dropped every other property's description, and the build
// cache then served that metadata to clean builds too.
tasks.named('compileJava', JavaCompile) {
    options.incremental = false
}

// META-INF/spring-configuration-metadata.json in every jar: IDE completion and docs for every property.
dependencies {
    annotationProcessor platform(libs.findLibrary('spring-boot-bom').get())
    annotationProcessor libs.findLibrary('spring-boot-configuration-processor').get()
}

// Every property the jar's metadata lists has a description (its record's @param): the build fails
// on one without, so a constructor that hides the Javadoc from the processor is caught.
def verifyConfigurationMetadata = tasks.register('verifyConfigurationMetadata') {
    def metadata = layout.buildDirectory.file('classes/java/main/META-INF/spring-configuration-metadata.json')
    def projectName = project.name // read now: the configuration cache has no project when it runs
    inputs.files(tasks.named('compileJava'))
    doLast {
        def file = metadata.get().asFile
        if (!file.exists()) return
        def undescribed = new groovy.json.JsonSlurper().parse(file).properties
            .findAll { !it.description }
            .collect { it.name }
        if (undescribed) {
            throw new GradleException("Properties without a description in ${projectName}: ${undescribed.join(', ')}")
        }
    }
}
tasks.named('check') { dependsOn verifyConfigurationMetadata }

publishing {
    publications {
        library(MavenPublication) { from components.java } // with test fixtures, where a library has them
    }
    // Only the release workflow publishes. Credentials are the Gradle properties
    // githubPackagesUsername and githubPackagesPassword; without them `publish` fails.
    repositories {
        maven {
            name = 'githubPackages'
            url = 'https://maven.pkg.github.com/khakimjanovich/platform'
            credentials(PasswordCredentials)
        }
    }
}
