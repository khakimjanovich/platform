// `check` here checks every library, and the build conventions themselves.
plugins {
    id 'base'
}

// build-logic's projects: the convention plugins and platform.settings.
def buildLogicTasks = { String task -> [':', ':settings-plugin:'].collect { gradle.includedBuild('build-logic').task(it + task) } }

def checks = subprojects.findAll { it.buildFile.exists() && it.name != 'versioning' }.collect { "${it.path}:check" }
tasks.named('check') {
    dependsOn checks
    dependsOn buildLogicTasks('check')
}

def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')
def snapshot = { String alias -> catalog.findVersion(alias).map { it.requiredVersion.endsWith('-SNAPSHOT') }.orElse(false) }
def snapshotProjects = subprojects.findAll { it.buildFile.exists() }
    .findAll { snapshot(it.name == 'versioning' ? 'platform' : "platform-${it.name}") }
    .collect { it.path }
def buildLogicSnapshot = snapshot('platform-build')

tasks.register('publishLocal') {
    group = 'publishing'
    description = 'Publishes every -SNAPSHOT artifact, the build plugins and the catalog to Maven local.'
    snapshotProjects.each { dependsOn "${it}:publishToMavenLocal" }
    if (buildLogicSnapshot) dependsOn buildLogicTasks('publishToMavenLocal')
}

tasks.register('publishSnapshots') {
    group = 'publishing'
    description = 'Publishes every -SNAPSHOT artifact, the build plugins and the catalog to GitHub Packages.'
    snapshotProjects.each { dependsOn "${it}:publishAllPublicationsToGithubPackagesRepository" }
    if (buildLogicSnapshot) dependsOn buildLogicTasks('publishAllPublicationsToGithubPackagesRepository')
}
