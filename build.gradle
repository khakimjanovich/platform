// The hub's three artifacts at one version: the line in the catalog (`platform`, 1.x-SNAPSHOT) on a
// branch, X.Y.Z from -PreleaseVersion when a tag releases. `./gradlew check` and `publish` cover all three.
def hubVersion = providers.gradleProperty('releaseVersion').orElse(libs.versions.platform).get()

subprojects {
    group = 'uz.khakimjanovich'
    version = hubVersion

    pluginManager.withPlugin('maven-publish') {
        publishing {
            // Credentials are the Gradle properties githubPackagesUsername and githubPackagesPassword.
            repositories {
                maven {
                    name = 'githubPackages'
                    url = 'https://maven.pkg.github.com/khakimjanovich/platform'
                    credentials(PasswordCredentials)
                }
            }
        }
    }
}
