// Loads every library's own defaults and error definitions, below the app's configuration: a
// library lists its files in META-INF/spring/uz.heeypay.ecom.config.LibraryDefaults.imports and
// ships no Java for it. Only Spring Boot's core, so every library can depend on it.
plugins {
    id 'ecom.library'
}

dependencies {
    api platform(libs.spring.boot.bom)
    implementation libs.spring.boot.core
}
