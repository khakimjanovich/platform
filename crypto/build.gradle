// Encryption for data that must never be readable in the database: AES-256-GCM with key ids and
// rotation, and a keyed blind index to find equal values without decrypting them. Its keys come from
// Vault (spring.config.import=vault://…), like every secret.
plugins {
    id 'ecom.library'
    id 'ecom.integration-test'
}

dependencies {
    api platform(libs.spring.boot.bom)
    implementation libs.spring.boot.autoconfigure
    implementation libs.starter.validation // the keys are checked at startup

    integrationTestImplementation project(':vault') // the keys, from Vault as in the app
    integrationTestImplementation libs.testcontainers.junit
    integrationTestImplementation libs.testcontainers.vault
}
