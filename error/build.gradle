// One error format for every module: RFC 9457 problem details plus a stable error code.
plugins {
    id 'ecom.library'
    id 'java-test-fixtures' // ErrorDefinitions: the completeness check every service runs
    id 'ecom.integration-test'
}

dependencies {
    api platform(libs.spring.boot.bom)
    runtimeOnly project(':config') // loads the files in META-INF/spring/…LibraryDefaults.imports
    api libs.spring.webmvc
    implementation libs.spring.boot.autoconfigure
    implementation project(':masking') // error log lines are masked
    implementation libs.jakarta.validation // a @Validated service's refusal is a 400
    implementation libs.slf4j.api // the trace id, from the logging context
    implementation libs.jackson3.databind // a problem from an exception made without converters
    compileOnly libs.jakarta.servlet
    compileOnly libs.spring.security.web // security problems only when the app uses Spring Security

    testFixturesImplementation platform(libs.spring.boot.bom)
    testFixturesImplementation libs.starter.test

    testImplementation libs.starter.webmvc
    testImplementation libs.starter.validation
    testImplementation libs.spring.security.web

    integrationTestImplementation libs.starter.security
    integrationTestImplementation libs.wiremock
}
