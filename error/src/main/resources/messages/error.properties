# Error details in English (the default). Russian and Uzbek live beside this file.
# Messages always go through MessageFormat: write '' for an apostrophe and {0} for an argument.
INTERNAL_ERROR=Something went wrong on our side. Please try again.
VALIDATION_FAILED=Some fields are invalid.
UNAUTHORIZED=Sign in with a valid access token.
FORBIDDEN=Your account isn''t allowed to do this.

# Spring's own errors (key: problemDetail.<exception class>).
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Method ''{0}'' isn''t supported here.
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Content type ''{0}'' isn''t supported.
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=We can''t answer in the format you asked for.
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=The request body can''t be read.
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Parameter ''{0}'' is required.
problemDetail.org.springframework.beans.TypeMismatchException=''{1}'' isn''t a valid value for ''{0}''.
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Nothing is here.
