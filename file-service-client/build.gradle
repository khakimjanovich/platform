// How any service stores files: the file service's generated @HttpExchange interface behind one
// client, auto-configured from file.service.client.*.
plugins {
    id 'ecom.library'
}

dependencies {
    api platform(libs.spring.boot.bom)
    api libs.ecom.file.service.api
    api libs.spring.web
    implementation libs.spring.boot.autoconfigure
}
