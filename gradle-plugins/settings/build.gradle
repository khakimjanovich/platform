// io.github.org4j.settings: where a build takes org4j from (local, snapshot or release).
plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

gradlePlugin {
    plugins {
        settings {
            id = 'io.github.org4j.settings'
            implementationClass = 'io.github.org4j.gradle.settings.Org4jSettingsPlugin'
        }
    }
}

dependencies {
    testImplementation platform(libs.spring.boot.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
