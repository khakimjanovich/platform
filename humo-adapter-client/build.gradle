// How any service calls the Humo adapter: its generated @HttpExchange interfaces behind one client,
// auto-configured from humo.adapter.client.*.
plugins {
    id 'ecom.library'
}

dependencies {
    api platform(libs.spring.boot.bom)
    api libs.ecom.humo.adapter.api
    api libs.spring.web
    implementation libs.spring.boot.autoconfigure
}
