// Logs, traces and metrics the same way in every service: logs with their trace on the console and
// over OTLP, traces carried on every call, and metrics over OTLP. Adding the jar is enough: its
// observability-defaults.yaml loads itself, below the service's own configuration.
plugins {
    id 'ecom.library'
}

dependencies {
    api platform(libs.spring.boot.bom)
    api libs.starter.opentelemetry
    api libs.opentelemetry.logback.appender
    api libs.starter.restclient
    api project(":masking")
    implementation libs.jackson3.databind
    implementation libs.spring.boot.autoconfigure
}
