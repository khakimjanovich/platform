// Logs, traces and metrics the same way in every service: logs with their trace on the console and
// over OTLP, traces carried on every call, and metrics over OTLP. Adding the jar is enough: the
// config library loads its observability-defaults.yaml, below the service's own configuration.
plugins {
    id 'ecom.library'
    id 'ecom.integration-test'
}

dependencies {
    api platform(libs.spring.boot.bom)
    runtimeOnly project(':config') // loads the files in META-INF/spring/…LibraryDefaults.imports
    api libs.starter.opentelemetry
    api libs.opentelemetry.logback.appender
    api libs.starter.restclient
    api project(":masking")
    implementation libs.spring.boot.autoconfigure
    compileOnly libs.jakarta.servlet // X-Request-Id, in a web app only

    testImplementation libs.starter.webmvc

    integrationTestImplementation libs.starter.webmvc
    integrationTestImplementation libs.spring.boot.testcontainers
    integrationTestImplementation libs.testcontainers.grafana
    integrationTestImplementation libs.testcontainers.junit
    integrationTestImplementation libs.wiremock
}
