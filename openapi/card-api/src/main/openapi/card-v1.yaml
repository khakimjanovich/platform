# Card API: the card vault, for the bank's admins. No card number ever leaves.
openapi: 3.0.3
info:
  title: Card API
  version: "1"
security:
  - bearer: []

paths:
  /internal/v1/cards/bindings:
    post:
      tags: [CardInternal]
      operationId: startCardBinding
      summary: Checks the number (Luhn, a known BIN), stores it encrypted and asks the scheme to send a code to the cardholder; the same card always gets the same token
      description: Inside the app only; never routed from outside.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindingRequest" }
      responses:
        "200":
          description: The binding, waiting for the code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BindingResponse" }

  /internal/v1/cards/bindings/{bindingId}/confirm:
    post:
      tags: [CardInternal]
      operationId: confirmCardBinding
      summary: The code the cardholder typed; the card can be debited from now on
      description: Inside the app only; never routed from outside.
      parameters: [{ name: bindingId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: The card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResponse" }

  /internal/v1/cards/{cardToken}:
    get:
      tags: [CardInternal]
      operationId: findCard
      summary: The card by its token, for other modules; empty means none
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      responses:
        "200":
          description: The card, or an empty list
          content:
            application/json:
              schema: 
                type: array
                maxItems: 1
                items: { $ref: "#/components/schemas/CardResponse" }

  /internal/v1/cards/{cardToken}/debit:
    post:
      tags: [CardInternal]
      operationId: debitCard
      summary: Takes the money from a bound card through its scheme; paymentRef makes the call idempotent at the scheme
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebitRequest" }
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /internal/v1/cards/{cardToken}/payments/{paymentRef}:
    get:
      tags: [CardInternal]
      operationId: cardPaymentStatus
      summary: "What the card's scheme knows about a payment we sent, by our id for it: asked when a debit, reversal or refund got no answer"
      description: >-
        Inside the app only; never routed from outside. Read-only: it only asks the scheme and never
        moves money (a Humo hold still waiting comes back APPROVED with held; capture it with
        captureCardPayment). A payment the scheme has no record of is DECLINED with
        CARD_PAYMENT_NOT_FOUND. A payment the scheme shows given back (reversed or refunded) is
        APPROVED with returned; only Uzcard shows this (Humo's GetPayment has no such status).
      parameters: [{ $ref: "#/components/parameters/CardToken" }, { name: paymentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /internal/v1/cards/{cardToken}/payments/{paymentRef}/capture:
    post:
      tags: [CardInternal]
      operationId: captureCardPayment
      summary: "Takes a held payment (Humo authorized, not captured), by our id for it; Uzcard has no holds"
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }, { name: paymentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /internal/v1/cards/{cardToken}/reversal:
    post:
      tags: [CardInternal]
      operationId: reverseCardPayment
      summary: "Gives a debit back before the scheme's settlement: the whole amount, as if it never happened"
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnRequest" }
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /internal/v1/cards/{cardToken}/refund:
    post:
      tags: [CardInternal]
      operationId: refundCardPayment
      summary: "Returns a settled debit to the card: the whole amount"
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnRequest" }
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /internal/v1/scheme-reports/uzcard/detail:
    get:
      tags: [CardInternal]
      operationId: uzcardReportDetail
      summary: "One page of Uzcard's report of a business day (report.detail), card numbers masked"
      description: >-
        Inside the app only; never routed from outside. The day runs from 00:00:00 to 23:59:59 in
        Tashkent. The report covers every terminal of the bank's SV-Gate login, so it has no terminal
        filter: each item names its terminal. A page with fewer items than size is the last one. A
        page Uzcard answered with an error, or with an item missing its reference, amount or time, is
        not complete: it is never matched, only pulled again.
      parameters:
        - { $ref: "#/components/parameters/Day" }
        - { name: page, in: query, required: true, schema: { type: integer, format: int32, minimum: 0 } }
        - { name: size, in: query, required: true, schema: { type: integer, format: int32, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UzcardReportPage" }

  /internal/v1/scheme-reports/uzcard/sum:
    get:
      tags: [CardInternal]
      operationId: uzcardReportSum
      summary: "How many transactions and how much Uzcard reports for a business day (report.sum): the control total"
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/Day" }]
      responses:
        "200":
          description: The totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UzcardReportSum" }

  /internal/v1/scheme-reports/humo/terminal-totals:
    get:
      tags: [CardInternal]
      operationId: humoTerminalTotals
      summary: "Humo's totals per terminal for a business day, from the terminal reconciliations (SOAP_RECO) of that day"
      description: >-
        Inside the app only; never routed from outside. Each terminal's reconciliations whose slot
        falls on the day (Tashkent) are added up. A terminal with a failed or unfinished
        reconciliation that day says so in failedRuns: its totals are incomplete.
      parameters: [{ $ref: "#/components/parameters/Day" }]
      responses:
        "200":
          description: One row per terminal reconciled that day
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HumoTerminalTotals" }

  /internal/v1/scheme-reports/humo/transactions/{rrn}:
    get:
      tags: [CardInternal]
      operationId: humoTransactionsByRrn
      summary: "Humo's records of a transaction by its RRN (middleware rrn/transaction), amounts in tiyin"
      description: >-
        Inside the app only; never routed from outside. Humo writes the amounts in UZS with decimals
        ("500.00"); they come back in tiyin, converted exactly. An empty list means Humo has no
        record. commissionFee is the fee Humo charged; it is absent when Humo did not send one.
      parameters: [{ name: rrn, in: path, required: true, schema: { type: string, maxLength: 12 } }]
      responses:
        "200":
          description: The records, or an empty list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HumoTransaction" }

  /api/v1/admin/cards/search:
    post:
      tags: [CardAdmin]
      operationId: searchCard
      summary: Finds a stored card by its number without decrypting any card (the lookup is audited)
      description: A POST, so the card number never sits in a URL or an access log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardSearchRequest" }
      responses:
        "200": { $ref: "#/components/responses/Card" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/cards/{cardToken}:
    get:
      tags: [CardAdmin]
      operationId: getCard
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      responses:
        "200": { $ref: "#/components/responses/Card" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/cards/{cardToken}/audit:
    get:
      tags: [CardAdmin]
      operationId: cardAudit
      summary: Every use of the card's data, oldest first
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CardAuditResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token from realm ecom
  parameters:
    Day:
      name: day
      in: query
      required: true
      description: The business day, in Tashkent
      schema: { type: string, format: date }
    CardToken:
      name: cardToken
      in: path
      required: true
      schema: { type: string, pattern: "^ctk_[0-9a-f]{32}$" }
  responses:
    Card:
      description: The card, masked
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CardResponse" }
  schemas:
    CardScheme:
      type: string
      enum: [UZCARD, HUMO]
    CardSearchRequest:
      type: object
      required: [number]
      properties:
        number: { type: string, pattern: "^[0-9]{16}$" }
    CardStatus:
      type: string
      enum: [PENDING, ACTIVE]
    CardResponse:
      type: object
      required: [cardToken, scheme, maskedNumber, status, createdAt]
      properties:
        cardToken: { type: string }
        scheme: { $ref: "#/components/schemas/CardScheme" }
        maskedNumber: { type: string, example: "860014******7890" }
        status: { $ref: "#/components/schemas/CardStatus" }
        createdAt: { type: string, format: date-time }
        boundAt: { type: string, format: date-time }
    CardAuditResponse:
      type: object
      required: [action, actor, occurredAt]
      properties:
        action: { type: string, enum: [BINDING_STARTED, BOUND, DEBITED, STATUS_ASKED, REVERSED, REFUNDED, LOOKED_UP] }
        actor: { type: string }
        reference: { type: string, description: The payment a debit belongs to }
        occurredAt: { type: string, format: date-time }
    BindingRequest:
      type: object
      required: [number, expiry]
      properties:
        number: { type: string, pattern: "^[0-9]{16}$" }
        expiry: { type: string, pattern: "^[0-9]{2}(0[1-9]|1[0-2])$", description: YYMM }
    BindingResponse:
      type: object
      required: [bindingId, cardToken, scheme, maskedNumber]
      description: A code is on its way; bindingId is what confirming it needs
      properties:
        bindingId: { type: string, format: uuid }
        cardToken: { type: string }
        scheme: { $ref: "#/components/schemas/CardScheme" }
        maskedNumber: { type: string }
    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    DebitRequest:
      type: object
      required: [paymentRef, amount, merchantId, terminalId]
      properties:
        paymentRef: { type: string, description: Our id for the payment }
        amount: { type: integer, format: int64, minimum: 1, description: In tiyin }
        merchantId: { type: string }
        terminalId: { type: string }
    ReturnRequest:
      type: object
      required: [paymentRef, processorRef]
      properties:
        paymentRef: { type: string, description: Our id for the payment }
        processorRef: { type: string, description: "The scheme's id for the debit" }
    Outcome:
      type: string
      description: "APPROVED or DECLINED are final. UNKNOWN means the scheme didn't say (a timeout, a server error): never treat it as a decline, the money may have moved."
      enum: [APPROVED, DECLINED, UNKNOWN]
    OperationResult:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: "#/components/schemas/Outcome" }
        declineCode: { type: string }
        processorRef: { type: string }
        rrn: { type: string }
        held: { type: boolean, description: "A status answer only: APPROVED, but the money is only held (Humo authorized, not captured)" }
        returned: { type: boolean, description: "A status answer only: APPROVED, and the scheme shows the money given back to the card (Uzcard REVERSE_SUCCESS)" }
    UzcardReportPage:
      type: object
      required: [day, page, size, complete, items]
      properties:
        day: { type: string, format: date }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        complete: { type: boolean, description: "False: Uzcard answered with an error, or an item lacks its reference, amount or time; pull the page again" }
        items:
          type: array
          items: { $ref: "#/components/schemas/UzcardReportItem" }
    UzcardReportItem:
      type: object
      required: [refNum]
      properties:
        refNum: { type: string, description: "SV's unique id for the transaction" }
        rrn: { type: string, description: "refNum, zero-padded to 12 digits" }
        ext: { type: string, description: "Our payment id, as sent with the debit" }
        maskedPan: { type: string, example: "860014******7890" }
        tranType: { type: string, description: "DEBIT, REVERSAL, CREDIT…" }
        amount: { type: integer, format: int64, description: In tiyin }
        terminalId: { type: string }
        merchantId: { type: string }
        time: { type: string, format: date-time }
        status: { type: string, description: "Uzcard's status: OK, ERR, ROK (reversed) or RER" }
    UzcardReportSum:
      type: object
      required: [day, count, sum]
      properties:
        day: { type: string, format: date }
        count: { type: integer, format: int64 }
        sum: { type: integer, format: int64, description: In tiyin }
    HumoTerminalTotals:
      type: object
      required: [terminalId, debitsNumber, debitsAmount, reversalsNumber, reversalsAmount, runs, failedRuns]
      properties:
        terminalId: { type: string }
        debitsNumber: { type: integer, format: int64 }
        debitsAmount: { type: integer, format: int64, description: In tiyin }
        reversalsNumber: { type: integer, format: int64 }
        reversalsAmount: { type: integer, format: int64, description: In tiyin }
        runs: { type: integer, format: int32, description: Reconciliations of the terminal that day }
        failedRuns: { type: integer, format: int32, description: "Of them, failed or unfinished: above 0 the totals are incomplete" }
    HumoTransaction:
      type: object
      required: [rrn]
      properties:
        rrn: { type: string }
        terminalId: { type: string }
        merchantId: { type: string }
        time: { type: string, description: "Humo's transaction time, as Humo writes it (respon_Date)" }
        tranAmount: { type: integer, format: int64, description: "In tiyin: the amount with Humo's fee (tran_Amount)" }
        amount: { type: integer, format: int64, description: In tiyin }
        commissionFee: { type: integer, format: int64, description: "In tiyin: the fee Humo charged (commission_Fee); absent when Humo sent none" }
