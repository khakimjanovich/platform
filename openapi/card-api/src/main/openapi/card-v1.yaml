# Card API: the card vault, for the bank's admins. No card number ever leaves.
openapi: 3.0.3
info:
  title: Card API
  version: "1"
security:
  - bearer: []

paths:
  /internal/v1/cards/bindings:
    post:
      tags: [CardInternal]
      operationId: startCardBinding
      summary: Checks the number (Luhn, a known BIN), stores it encrypted and asks the scheme to send a code to the cardholder; the same card always gets the same token
      description: Inside the app only; never routed from outside.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindingRequest" }
      responses:
        "200":
          description: The binding, waiting for the code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BindingResponse" }

  /internal/v1/cards/bindings/{bindingId}/confirm:
    post:
      tags: [CardInternal]
      operationId: confirmCardBinding
      summary: The code the cardholder typed; the card can be debited from now on
      description: Inside the app only; never routed from outside.
      parameters: [{ name: bindingId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: The card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardResponse" }

  /internal/v1/cards/{cardToken}:
    get:
      tags: [CardInternal]
      operationId: findCard
      summary: The card by its token, for other modules; empty means none
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      responses:
        "200":
          description: The card, or an empty list
          content:
            application/json:
              schema: 
                type: array
                maxItems: 1
                items: { $ref: "#/components/schemas/CardResponse" }

  /internal/v1/cards/{cardToken}/debit:
    post:
      tags: [CardInternal]
      operationId: debitCard
      summary: Takes the money from a bound card through its scheme; paymentRef makes the call idempotent at the scheme
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DebitRequest" }
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /internal/v1/cards/{cardToken}/payments/{paymentRef}:
    get:
      tags: [CardInternal]
      operationId: cardPaymentStatus
      summary: "What the card's scheme knows about a payment we sent, by our id for it: asked when a debit got no answer"
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }, { name: paymentRef, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /internal/v1/cards/{cardToken}/reversal:
    post:
      tags: [CardInternal]
      operationId: reverseCardPayment
      summary: "Gives a debit back before the scheme's settlement: the whole amount, as if it never happened"
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnRequest" }
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /internal/v1/cards/{cardToken}/refund:
    post:
      tags: [CardInternal]
      operationId: refundCardPayment
      summary: "Returns a settled debit to the card: the whole amount"
      description: Inside the app only; never routed from outside.
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnRequest" }
      responses:
        "200":
          description: The scheme's answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResult" }

  /api/v1/admin/cards/search:
    post:
      tags: [CardAdmin]
      operationId: searchCard
      summary: Finds a stored card by its number without decrypting any card (the lookup is audited)
      description: A POST, so the card number never sits in a URL or an access log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardSearchRequest" }
      responses:
        "200": { $ref: "#/components/responses/Card" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/cards/{cardToken}:
    get:
      tags: [CardAdmin]
      operationId: getCard
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      responses:
        "200": { $ref: "#/components/responses/Card" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/cards/{cardToken}/audit:
    get:
      tags: [CardAdmin]
      operationId: cardAudit
      summary: Every use of the card's data, oldest first
      parameters: [{ $ref: "#/components/parameters/CardToken" }]
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CardAuditResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token from realm ecom
  parameters:
    CardToken:
      name: cardToken
      in: path
      required: true
      schema: { type: string, pattern: "^ctk_[0-9a-f]{32}$" }
  responses:
    Card:
      description: The card, masked
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CardResponse" }
    Problem:
      description: RFC 9457 problem detail with a stable error code
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CardScheme:
      type: string
      enum: [UZCARD, HUMO]
    CardSearchRequest:
      type: object
      required: [number]
      properties:
        number: { type: string, pattern: "^[0-9]{16}$" }
    CardStatus:
      type: string
      enum: [PENDING, ACTIVE]
    CardResponse:
      type: object
      required: [cardToken, scheme, maskedNumber, status, createdAt]
      properties:
        cardToken: { type: string }
        scheme: { $ref: "#/components/schemas/CardScheme" }
        maskedNumber: { type: string, example: "860014******7890" }
        status: { $ref: "#/components/schemas/CardStatus" }
        createdAt: { type: string, format: date-time }
        boundAt: { type: string, format: date-time }
    CardAuditResponse:
      type: object
      required: [action, actor, occurredAt]
      properties:
        action: { type: string, enum: [BINDING_STARTED, BOUND, DEBITED, STATUS_ASKED, REVERSED, REFUNDED, LOOKED_UP] }
        actor: { type: string }
        reference: { type: string, description: The payment a debit belongs to }
        occurredAt: { type: string, format: date-time }
    BindingRequest:
      type: object
      required: [number, expiry]
      properties:
        number: { type: string, pattern: "^[0-9]{16}$" }
        expiry: { type: string, pattern: "^[0-9]{2}(0[1-9]|1[0-2])$", description: YYMM }
    BindingResponse:
      type: object
      required: [bindingId, cardToken, scheme, maskedNumber]
      description: A code is on its way; bindingId is what confirming it needs
      properties:
        bindingId: { type: string, format: uuid }
        cardToken: { type: string }
        scheme: { $ref: "#/components/schemas/CardScheme" }
        maskedNumber: { type: string }
    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    DebitRequest:
      type: object
      required: [paymentRef, amount, merchantId, terminalId]
      properties:
        paymentRef: { type: string, description: Our id for the payment }
        amount: { type: integer, format: int64, minimum: 1, description: In tiyin }
        merchantId: { type: string }
        terminalId: { type: string }
    ReturnRequest:
      type: object
      required: [paymentRef, processorRef]
      properties:
        paymentRef: { type: string, description: Our id for the payment }
        processorRef: { type: string, description: "The scheme's id for the debit" }
    Outcome:
      type: string
      description: "APPROVED or DECLINED are final. UNKNOWN means the scheme didn't say (a timeout, a server error): never treat it as a decline, the money may have moved."
      enum: [APPROVED, DECLINED, UNKNOWN]
    OperationResult:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: "#/components/schemas/Outcome" }
        declineCode: { type: string }
        processorRef: { type: string }
        rrn: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem detail. `code` is stable and meant for programs; `detail` is for people.
      required: [status, title, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
