# e-POS API: the bank's e-POS terminals (a MID and a TID) each website's payments go through.
openapi: 3.0.3
info:
  title: e-POS API
  version: "1"
security:
  - bearer: []

paths:
  /internal/v1/epos/live:
    get:
      tags: [EposInternal]
      operationId: findLiveEpos
      summary: The live e-POS terminal for a website and card scheme, for other modules; empty means none
      description: Inside the app only; never routed from outside.
      parameters:
        - { name: salesPointId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: scheme, in: query, required: true, schema: { $ref: "#/components/schemas/CardScheme" } }
      responses:
        "200":
          description: The live e-POS terminal, or an empty list
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items: { $ref: "#/components/schemas/EposResponse" }

  /api/v1/admin/sales-points/{salesPointId}/epos:
    get:
      tags: [EposAdmin]
      operationId: listEpos
      summary: A website's e-POS terminals, newest first
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      responses:
        "200":
          description: e-POS terminals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EposResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [EposAdmin]
      operationId: registerEpos
      summary: Registers an e-POS terminal the processing center issued; it is live at once
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EposRequest" }
      responses:
        "201": { $ref: "#/components/responses/Epos" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}/epos/route:
    get:
      tags: [EposAdmin]
      operationId: routeEpos
      summary: The e-POS terminal a payment with this card scheme would go through now
      parameters:
        - { $ref: "#/components/parameters/SalesPointId" }
        - { name: scheme, in: query, required: true, schema: { $ref: "#/components/schemas/CardScheme" } }
      responses:
        "200": { $ref: "#/components/responses/Epos" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/epos:
    get:
      tags: [EposAdmin]
      operationId: searchEpos
      summary: Every e-POS terminal, newest first, filtered and a page at a time
      parameters:
        - { name: salesPointId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: scheme, in: query, required: false, schema: { $ref: "#/components/schemas/CardScheme" } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/EposStatus" } }
        - { name: q, in: query, required: false, description: "Part of a MID or TID", schema: { type: string, maxLength: 30 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
      responses:
        "200":
          description: A page of e-POS terminals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EposPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/epos/{eposId}:
    get:
      tags: [EposAdmin]
      operationId: getEpos
      parameters: [{ $ref: "#/components/parameters/EposId" }]
      responses:
        "200": { $ref: "#/components/responses/Epos" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/epos/{eposId}/suspend:
    post:
      tags: [EposAdmin]
      operationId: suspendEpos
      parameters: [{ $ref: "#/components/parameters/EposId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Epos" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/epos/{eposId}/resume:
    post:
      tags: [EposAdmin]
      operationId: resumeEpos
      parameters: [{ $ref: "#/components/parameters/EposId" }]
      responses:
        "200": { $ref: "#/components/responses/Epos" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/epos/{eposId}/revoke:
    post:
      tags: [EposAdmin]
      operationId: revokeEpos
      parameters: [{ $ref: "#/components/parameters/EposId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Epos" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/epos/{eposId}/audit:
    get:
      tags: [EposAdmin]
      operationId: eposAudit
      summary: Every change to the e-POS terminal, oldest first
      parameters: [{ $ref: "#/components/parameters/EposId" }]
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EposAuditResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token from realm ecom
  parameters:
    SalesPointId:
      name: salesPointId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EposId:
      name: eposId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
  responses:
    Epos:
      description: The e-POS terminal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EposResponse" }
    Problem:
      description: RFC 9457 problem detail with a stable error code
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CardScheme:
      type: string
      enum: [UZCARD, HUMO]
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    EposStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, REVOKED]
    EposRequest:
      type: object
      required: [scheme, merchantId, terminalId]
      properties:
        scheme: { $ref: "#/components/schemas/CardScheme" }
        merchantId: { type: string, minLength: 1, maxLength: 30, pattern: "^[A-Za-z0-9]+$", description: MID from the processing center }
        terminalId: { type: string, minLength: 1, maxLength: 30, pattern: "^[A-Za-z0-9]+$", description: TID from the processing center }
    EposResponse:
      type: object
      required: [id, salesPointId, scheme, merchantId, terminalId, status, registeredBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        salesPointId: { type: string, format: uuid }
        scheme: { $ref: "#/components/schemas/CardScheme" }
        merchantId: { type: string }
        terminalId: { type: string }
        status: { $ref: "#/components/schemas/EposStatus" }
        registeredBy: { type: string }
        createdAt: { type: string, format: date-time }
    EposPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EposResponse" }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    EposAuditResponse:
      type: object
      required: [action, actor, occurredAt]
      properties:
        action: { type: string, enum: [REGISTERED, SUSPENDED, RESUMED, REVOKED] }
        actor: { type: string }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
    Problem:
      type: object
      description: RFC 9457 problem detail. `code` is stable and meant for programs; `detail` is for people.
      required: [status, title, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
