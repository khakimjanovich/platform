          format: int32
          description: Account priority
        status:
          type: string
          description: Account status, one of Active, Dormant, Closed
        additionalInfo:
          type: string
          description: Additional information supplied by the processing centre
        availableAmount:
          type: number
          description: Available amount in minor units of the account currency
        exponent:
          type: integer
          format: int32
          description: Currency exponent of the account, returned when returnExponent is requested
