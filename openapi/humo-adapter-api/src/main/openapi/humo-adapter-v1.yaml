    HumoAdapterStatusCode:
      type: string
      description: 'Status the HUMO call result has to be treated with. SUCCESS is the only value returned in the
        200 envelope; the other values name the resolved category of a HUMO error (Middleware error code or Payment
        Server response code) and are carried in the message of the error response.

        '
      enum:
      - SUCCESS
      - ERROR
      - UNAUTHORIZED
      - SERVICE_UNAVAILABLE
    IiacsAccountRecord:
      type: object
      description: Account record tied to the card
      properties:
        institutionId:
          type: string
          description: Institution identifier of the account
        accountId:
          type: string
          description: Account identifier in the processing centre
        bankAccountId:
          type: string
          description: Bank account number
        currency:
          type: string
          description: Numeric currency code of the account
        cardholderId:
          type: string
          description: Cardholder identifier the account belongs to
        effectiveDate:
          type: string
          description: Account effective date
        updateDate:
          type: string
