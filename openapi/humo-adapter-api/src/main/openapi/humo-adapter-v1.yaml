        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /cs/v1/transactions/scoring:
    post:
      summary: Score card transactions by month
