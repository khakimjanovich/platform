          properties:
            pan2:
              type: string
              description: Credited card PAN (pan2)
            expiry:
              type: string
              description: Card expiry, YYMM (expiry)
            amount:
              type: string
              description: Amount in tiyin (amount)
            merchantId:
              type: string
              description: Merchant identifier (merchant_id)
            terminalId:
              type: string
              description: Terminal identifier (terminal_id)
            ccyCode:
              type: string
              description: Currency numeric code (ccy_code)
            pointCode:
              type: string
              description: Point of service code (point_code)
            centreId:
              type: string
              description: Bank identifier (centre_id)
            senderSerialNo:
              type: string
              description: Sender document series (sender_serial_no)
            senderIdCard:
              type: string
              description: Sender document number (sender_id_card)
            senderSurname:
              type: string
              description: Sender surname (sender_surname)
            senderFirstName:
              type: string
              description: Sender first name (sender_first_name)
            senderRetrievalRefNumber:
              type: string
              description: Sender retrieval reference number (sender_retrieval_ref_number)
            senderPersonCode:
              type: string
              description: Sender PINFL (sender_person_code)
            senderPan:
              type: string
              description: Sender card PAN (sender_pan)
            internalPan2Masked:
