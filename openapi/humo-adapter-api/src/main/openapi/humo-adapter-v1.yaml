            authMsgRef1a:
              type: string
              description: Authorization message reference (1A field)
            transactionAmount:
              type: string
              description: Transaction amount
            authRowNumb1:
              type: string
              description: Authorization row number
            authMsgRef1:
              type: string
              description: Authorization message reference
            authActionCode1pr:
              type: string
              description: Authorization action code (1PR field), present when the amount was changed
            authRowNumb1pr:
              type: string
              description: Authorization row number (1PR field), present when the amount was changed
            authMsgRef1pr:
              type: string
              description: Authorization message reference (1PR field), present when the amount was changed
    CapturePaymentResult:
      type: object
      description: Envelope of the capture payment operation
      properties:
        requestId:
          type: string
