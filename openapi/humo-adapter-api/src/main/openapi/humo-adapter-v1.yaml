  /v3/iiacs/card2:
    post:
      summary: Get card information and tied accounts
      description: 'Card information, statuses and tied accounts, without balance and mobile banking: HUMO Middleware /v3/iiacs/card2 (HUMOMIDDLEWARE.pdf §3.2.1 p.29–31; the PDF gives examples only).

        '
