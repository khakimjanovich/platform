            authStan1a:
              type: string
              description: Authorization STAN (1A field)
            authTime:
              type: string
              description: Authorization timestamp (YYYYMMDDHHMMSS)
            stipClientId:
              type: string
              description: STIP client identifier
            cardType:
              type: string
              description: Card type code
            merchantName:
              type: string
              description: Merchant name
            acqInst:
