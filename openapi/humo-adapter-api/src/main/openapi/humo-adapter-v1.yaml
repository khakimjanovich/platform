        accountType:
          type: string
          description: Account type
        amountSetTime:
          type: string
          description: Time the amount was set (AMOUNT_SET_TIME)
        initialAmount:
          type: number
          description: Initial amount in minor units of the account currency
        bonusAmount:
          type: number
          description: Bonus amount in minor units
        bonusAmountExpiry:
          type: string
          description: Bonus amount expiry
        creditLimit:
          type: number
          description: Credit limit in minor units
        creditLimitExpiry:
          type: string
