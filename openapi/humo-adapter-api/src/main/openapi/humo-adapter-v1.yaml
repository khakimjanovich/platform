          $ref: '#/components/schemas/HumoAdapterStatusCode'
        data:
          type: array
          description: 'Transactions (rows)'
          items:
            $ref: '#/components/schemas/TransactionHistoryRow'
    RealPanRequest:
      type: object
      description: 'A masked card number (§3.5.2 p.52)'
