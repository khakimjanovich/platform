  /cs/v1/pan-by-person-code:
    post:
      summary: Get a card owner's person code (PINFL)
      description: 'HUMO Middleware /cs/v1/pan-by-person-code (§3.3.2.1): the PINFL of the card''s owner.

        '
      operationId: pinflByPan
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
