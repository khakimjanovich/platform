# Humo adapter: every operation of HUMOPAYMENT.pdf v2.2 and HUMOMIDDLEWARE.pdf v3.0.5, plus the card-add OTP (/v1/send/*) from open_banking.
openapi: 3.0.3
info:
  title: Humo Adapter
  version: '1'
  description: 'Adapter between our services and HUMO: the Payment Server (SOAP) and the Middleware (REST), proxied
    operation by operation. Every answer is an envelope {requestId, status, data}; a HUMO error is a problem detail
    whose `code` names the status and whose subErrors[0] carries HUMO''s own code.'
servers:
  - url: http://localhost:8092
    description: dev server

tags:
- name: HumoPaymentService
  description: Payment operations service endpoints
- name: HumoMiddlewareService
  description: HUMO Middleware endpoints — SMS permissions, IIACS card information and CS services
paths:
  /v1/payment/authorize:
    post:
      summary: Authorize DMS card debit payment
      description: 'Authorizes a card debit payment via the SOAP_DMS biller. Funds are held (blocked) on the cardholder''s
        account but not yet debited. Adapter proxies the request to the HUMO Payment Server SOAP method Payment
        (urn:PaymentServer). A response with action = 4 means the hold was placed successfully and the payment must
        subsequently be confirmed or cancelled.

        '
      operationId: authorizePayment
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizePaymentRequest'
      responses:
        '200':
          description: Payment authorized (funds held) successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizePaymentResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/payment/capture:
    post:
      summary: Capture (confirm) an authorized DMS card debit payment
      description: 'Confirms a previously authorized SOAP_DMS card debit payment with the unchanged (originally
        authorized) amount or, with amount, a changed one, causing the held funds to be debited from the cardholder''s account. paymentRef must
        be the same one used in the authorize request. Adapter proxies the request to the HUMO Payment Server SOAP
        method Payment (urn:PaymentServer) with confirmed = true and finished = true. If the cardholder cancels
        the payment instead, CancelRequest must be used.

        '
      operationId: capturePayment
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturePaymentRequest'
      responses:
        '200':
          description: Payment captured (funds debited) successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturePaymentResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/payment/cancel:
    post:
      summary: Cancel an active DMS card debit payment
      description: 'Cancels a payment identified by paymentId or paymentRef. Usable only for payments in "active"
        status; the held funds are released back to the cardholder''s account instantly. Adapter proxies the request
        to the HUMO Payment Server SOAP method CancelRequest (urn:PaymentServer). Cancellation must be performed
        within 14 days of the payment; otherwise the response returns auth_action_code_final "914 - Decline reason
        message: not able to trace back to original transaction", in which case the refund must be requested via
        the "№1 Reversal form" and the payment is cancelled by the HUMO Processing Center. HUMO refuses with a
        PaymentServerException: the adapter answers humo-soap-fault (502) with HUMO''s error code (914 here) in
        subErrors, and the hold is not released.

        '
      operationId: cancelPayment
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPaymentRequest'
      responses:
        '200':
          description: Payment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelPaymentResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/payment/refund:
    post:
      summary: Return (refund) a finished DMS card debit payment
      description: 'Returns (refunds) a payment identified by paymentId or paymentRef. Usable only for payments
        in "finished" status. Funds are returned to the cardholder after the nearest clearing cycle. Adapter proxies
        the request to the HUMO Payment Server SOAP method ReturnPayment (urn:PaymentServer). A refusal
        (PaymentServerException) is humo-soap-fault (502) with HUMO''s error code in subErrors.

        '
      operationId: refundPayment
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Payment returned (refunded) successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPaymentResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/reconciliation/authorize:
    post:
      summary: Authorize virtual terminal reconciliation (RECO)
      description: 'Starts a reconciliation (RECO) of the virtual terminal''s totals via the SOAP_RECO biller, required
        to finalize e-pos operations and build transaction files. It is recommended to run reconciliation at least
        3 times a day, 15 minutes before each clearing session, with a mandatory run between 23:45 and 00:00. A
        RECO must always be performed after a refundPayment, otherwise the funds will not be returned on time. Adapter
        proxies the request to the HUMO Payment Server SOAP method Payment (urn:PaymentServer). A response with
        action = 4 means the reconciliation must subsequently be confirmed via reconcileConfirm. Unlike authorizePayment
        and capturePayment, the reconciliation operations do not turn a non-approved answer into an error: a successful
        RECO legitimately carries auth_action_code_final values in the 500-504 range, so the adapter always answers
        200 with the raw action and the caller decides. Treat action = 4 as the only success and any other value
        as a failed RECO.

        '
      operationId: reconcileAuthorize
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileAuthorizeRequest'
      responses:
        '200':
          description: Reconciliation authorized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileAuthorizeResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/reconciliation/confirm:
    post:
      summary: Confirm virtual terminal reconciliation (RECO)
      description: 'Confirms a previously authorized reconciliation (RECO). paymentRef must be the same one used
        in the reconcileAuthorize request. Adapter proxies the request to the HUMO Payment Server SOAP method Payment
        (urn:PaymentServer) with confirmed = true and finished = true. A response with action = 10 means the reconciliation
        totals were finalized successfully.

        '
      operationId: reconcileConfirm
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileConfirmRequest'
      responses:
        '200':
          description: Reconciliation confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileConfirmResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/payment/status:
    get:
      summary: Get payment status
      description: 'Returns information about a payment and its status in the Processing Center. Adapter proxies
        the request to the HUMO Payment Server SOAP method GetPayment (urn:PaymentServer). Either paymentId or paymentRef
        must be supplied to identify the payment.

        '
      operationId: getPaymentStatus
      tags:
      - HumoPaymentService
      parameters:
      - name: paymentId
        in: query
        description: Unique payment identifier in the Payment Server
        required: false
        schema:
          type: integer
          format: int64
      - name: paymentRef
        in: query
        description: Payment reference number
        required: false
        schema:
          type: string
          maxLength: 64
      - name: paymentOriginator
        in: query
        description: Code of the system that originated the payment
        required: true
        schema:
          type: string
          maxLength: 32
      responses:
        '200':
          description: Payment information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/send/sms:
    post:
      summary: Send an SMS confirmation code to the given phone number
      description: 'Sends a one-time confirmation code to the supplied phone number for the given card, starting
        the flow that grants a permanent debit permission. The SMS is sent only for cards in statuses 000 and 125.
        Adapter proxies the request to the HUMO Middleware method /v1/send/sms and wraps the result into an envelope
        whose top-level status reflects how the call finished.

        '
      operationId: sendSms
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
      responses:
        '200':
          description: SMS sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/send/code:
    post:
      summary: Confirm the SMS code sent to the phone number
      description: 'Confirms the code previously sent via /v1/send/sms and, on success, grants a permanent debit
        permission for the card. The code is valid for 1 minute; after 3 incorrect codes the cardholder is blocked
        for 24 hours. Adapter proxies the request to the HUMO Middleware method /v1/send/code.

        '
      operationId: confirmSms
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsCodeRequest'
      responses:
        '200':
          description: Code confirmed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsCodeResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v3/iiacs/card:
    post:
      summary: Get card information with balance and mobile banking status
      description: 'Retrieves card information, statuses, tied accounts, the calculated balance and, when mbFlag
        is set, the mobile banking state with the cardholder''s phone number. Works for balance lookup after the
        SMS confirmation flow and for card status checks. Adapter proxies the request to the HUMO Middleware method
        /v3/iiacs/card.

        '
      operationId: iiacsCard
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IiacsCardRequest'
      responses:
        '200':
          description: Card information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IiacsCardResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/pm/bins:
    get:
      summary: Get the HUMO BIN list
      description: 'Returns the registry of HUMO BINs with the owning bank, owner kind and card type flags. Adapter
        proxies the request to the HUMO Middleware method /v2/pm/bins - the only GET in that API, whose response
        carries a bare data array instead of the id/result envelope. The registry changes rarely; the caller is
        expected to cache it rather than call per transaction.

        '
      operationId: listBins
      tags:
      - HumoMiddlewareService
      responses:
        '200':
          description: BIN list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinListResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/p2p/authorize:
    post:
      summary: Authorize a P2P card-to-card transfer inside HUMO
      description: 'P2P transfer between cards registered in HUMO (HUMO, co-badge): the Payment Server SOAP method Request (urn:PaymentServer) with switchingID and autoSwitch (HUMOPAYMENT.pdf §2.1). A response with action = 4 must be confirmed with p2pConfirm. A P2P transfer can be neither cancelled nor returned; a refund goes through HUMO''s reversal form.

        '
      operationId: p2pAuthorize
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/P2pAuthorizeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/p2p/confirm:
    post:
      summary: Confirm an authorized P2P transfer
      description: 'Confirms a P2P transfer by the paymentRef of its authorization: the Payment Server SOAP method Payment with confirmed = true and finished = true (HUMOPAYMENT.pdf §2.2). action = 10 means the transfer is confirmed.

        '
      operationId: p2pConfirm
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/P2pConfirmRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v1/credit/to-card:
    post:
      summary: Credit a HUMO card (SOAP_TOCARD_2)
      description: 'Credits a card account through the front-office instrument SOAP_TOCARD_2: the Payment Server SOAP method Request with billerRef and payinstrRef SOAP_TOCARD_2 (HUMOPAYMENT.pdf §4). One call, no confirmation: sending it again credits the card twice. action = 4 means success. It cannot be cancelled; a refund goes through HUMO''s reversal form.

        '
      operationId: creditToCard
      tags:
      - HumoPaymentService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditToCardRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditToCardResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/mb/customer/activate:
    post:
      summary: Activate mobile banking for a customer's card
      description: 'Activates mobile banking (SMS) services for the customer''s card and phone: HUMO Middleware /v2/mb/customer/activate (HUMOMIDDLEWARE.pdf §3.1.1).

        '
      operationId: mbActivate
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbActivateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbStateResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/mb/customer:
    post:
      summary: Get a mobile banking customer
      description: 'The customer''s mobile banking data: cards, phones, e-mails, charge: HUMO Middleware /v2/mb/customer (§3.1.2).

        '
      operationId: mbCustomer
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbCustomerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbCustomerResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/mb/customer-list:
    post:
      summary: Find mobile banking customers by phone
      description: 'The customers registered with a phone number: HUMO Middleware /v2/mb/customer-list (§3.1.3).

        '
      operationId: mbCustomerList
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbCustomerListRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbCustomerListResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/mb/customer/deactivate:
    post:
      summary: Deactivate mobile banking for a customer
      description: 'HUMO Middleware /v2/mb/customer/deactivate (§3.1.4).

        '
      operationId: mbDeactivate
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbDeactivateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbStateResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/mb/customer/change-phone-number:
    post:
      summary: Change a customer's mobile banking phone
      description: 'HUMO Middleware /v2/mb/customer/change-phone-number (§3.1.5); only one active phone is supported.

        '
      operationId: mbChangePhone
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbChangePhoneRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbStateResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/mb/customer/change-cardholders-message-lang:
    post:
      summary: Change a customer's SMS language
      description: 'HUMO Middleware /v2/mb/customer/change-cardholders-message-lang (§3.1.6).

        '
      operationId: mbChangeLanguage
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbChangeLanguageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbStateResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/mb/customer/remove-card:
    post:
      summary: Remove a card from mobile banking
      description: 'HUMO Middleware /v2/mb/customer/remove-card (§3.1.7). The PDF''s table has a flat pan, its example Card.pan; the adapter sends both.

        '
      operationId: mbRemoveCard
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbRemoveCardRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbStateResult'
        4XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
        5XX:
          $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem"
  /v2/mb/customer/edit-card:
    post:
      summary: Edit a customer's mobile banking card
      description: 'HUMO Middleware /v2/mb/customer/edit-card (§3.1.8).

        '
      operationId: mbEditCard
      tags:
      - HumoMiddlewareService
      requestBody:
        required: true
