          type: number
          description: Initial amount in minor units
        bonusAmount:
          type: number
          description: Bonus amount in minor units
        creditLimit:
          type: number
          description: Credit limit in minor units
        lockedBackofficeAmount:
          type: number
          description: Amount locked by the back office in minor units
        lockedBackofficeAmountOffline:
          type: number
          description: Amount locked by the back office offline in minor units
        lockedAmount:
          type: number
          description: Lock sum from STIP locks in minor units
        availableAmount:
          type: number
          description: Available amount calculated from initial amount, credit limit, bonus amount and locked amounts
        exponent:
          type: integer
          format: int32
          description: Currency exponent, returned when returnExponent is requested
    IiacsCardRecord:
      type: object
      description: Card record as returned by the HUMO Middleware IIACS service
      properties:
        institutionId:
          type: string
          description: Institution identifier of the issuing bank
        pan:
          type: string
          description: Card PAN as returned by the processing centre
        effectiveDate:
          type: string
          description: Card effective date
        updateDate:
          type: string
          description: Card record last update date
        prefixNumber:
          type: integer
          format: int64
          description: Card prefix number (PREF_REC_NUM, Decimal(11))
        expiry:
          type: string
          description: Card expiry date (YYMM)
        expiry2:
          type: string
          description: Second card expiry date (YYMM, EXPIRY_DATE_2)
        cardSequenceNumber:
          type: integer
          format: int32
          description: Card sequence number
        cardSequenceNumber2:
          type: integer
          format: int32
          description: Second card sequence number (CARD_SEQ_2)
        cardholderId:
          type: string
          description: Cardholder identifier in the processing centre
        nameOnCard:
          type: string
          description: Name embossed on the card
        cardholderMessage:
          type: string
          description: Cardholder message (CRD_HOLDR_MSG). The card record's cardholderPassword is never passed on
        accountRestrictionsFlag:
          type: string
          description: Account restrictions flag
        commissionGroup:
          type: string
          description: Commission group of the card
        cardUserId:
          type: string
          description: Card user identifier, used to derive the mobile banking customer identifier
        additionalInfo:
          type: string
          description: Additional information supplied by the processing centre
        riskGroup:
          type: string
          description: Risk group of the card
        riskGroup2:
          type: string
          description: Secondary risk group of the card
        bankCode:
          type: string
          description: Issuing bank code (BANK_C), digits 5-6 of a HUMO PAN
        pinTryCount:
          type: integer
          format: int32
          description: Wrong PIN attempts counter
        statuses:
          type: array
          description: Card status items; the card is fully operational only when every item has actionCode 000
          items:
            $ref: '#/components/schemas/IiacsCardStatusItem'
    IiacsCardRequest:
      type: object
      description: Request for card information with balance and optional mobile banking status
      required:
      - pan
      properties:
        pan:
          type: string
          maxLength: 16
          description: Card PAN (Primary Account Number)
        accountType:
          type: string
          description: Account type for filtering tied accounts
        currency:
          type: string
          maxLength: 3
          description: Currency for filtering tied accounts, for example EUR, RUR, USD
        returnExponent:
          type: boolean
          description: When true the currency exponents for accounts and balance are returned
        mbFlag:
          type: boolean
          description: When true the mobile banking status with the cardholder's phone number is returned
    IiacsCardResponse:
      type: object
      description: Card information with statuses, tied accounts, balance and mobile banking state
      properties:
        listSize:
          type: integer
          format: int32
          description: Count of retrieved account records
        card:
          $ref: '#/components/schemas/IiacsCardRecord'
        account:
          type: array
          description: List of account records tied to the card
          items:
            $ref: '#/components/schemas/IiacsAccountRecord'
        balance:
          $ref: '#/components/schemas/IiacsBalanceRecord'
        mb:
          $ref: '#/components/schemas/IiacsMobileBankRecord'
    IiacsCardResult:
      type: object
      description: Envelope of the /v3/iiacs/card operation
      properties:
        requestId:
          type: string
          description: Request identifier the operation was processed with
        status:
          $ref: '#/components/schemas/HumoAdapterStatusCode'
        data:
          $ref: '#/components/schemas/IiacsCardResponse'
    IiacsCardStatusItem:
      type: object
      description: Single card status item of the IIACS statuses block
      properties:
        type:
          type: string
          description: Status type, one of card, card2, hot, issuer, user
        actionCode:
          type: string
          description: Action code of the status, 000 means approved
        actionDescription:
          type: string
          description: Human readable description of the action code
        effectiveDate:
          type: string
          description: Date the status became effective
        note:
          type: string
          description: Optional note attached to the status
    IiacsMobileBankRecord:
      type: object
      description: Mobile banking status block, returned when mbFlag is requested
      properties:
        state:
          type: string
          description: State of the mobile banking agreement, one of on, off, off-phone, no-phone, off-card
        phone:
          type: string
          description: Phone number in international format, present only when the agreement state provides it
        message:
          type: string
          description: Description of the mobile banking state
    PaymentStatus:
      type: string
      description: Payment status
      enum:
      - AUTHORIZED
      - CAPTURED
      - NOT_FOUND
    ReconcileAuthorizeRequest:
      type: object
      description: Request to authorize a virtual terminal reconciliation (RECO) via the SOAP_RECO biller
      required:
      - billerRef
      - payinstrRef
      - paymentRef
      - terminalId
      - paymentOriginator
      properties:
        billerRef:
          type: string
          description: Reference of the biller to start the reconciliation with
        payinstrRef:
          type: string
          description: Reference of the payment instrument to use
        paymentRef:
          type: string
          maxLength: 64
          description: Payment identifier assigned by the sender of the request
        terminalId:
          type: string
          maxLength: 8
          description: Terminal identifier
        paymentOriginator:
          type: string
          description: Name of the payment originator (login)
    ReconcileAuthorizeResponse:
      type: object
      description: Result of the reconciliation authorization request
      required:
      - paymentId
      - action
      properties:
        paymentId:
          type: integer
          format: int64
          description: Unique payment identifier in the Payment Server
        paymentRef:
          type: string
          maxLength: 64
          description: Payment reference number
        action:
          type: integer
          description: 'Payment Server action code. 4 means the fields were filled in correctly and the reconciliation
            requires confirmation via reconcileConfirm.

            '
        details:
          type: object
          description: Reconciliation attributes returned by the Processing Center
          properties:
            terminalId:
              type: string
              description: Terminal identifier
            ttl:
              type: string
              description: Time-to-live of the reconciliation session (minutes)
            ttlAction:
              type: string
              description: Time-to-live action code
    ReconcileAuthorizeResult:
      type: object
      description: Envelope of the reconcile authorize operation
      properties:
        requestId:
          type: string
          description: Request identifier the operation was processed with
        status:
          $ref: '#/components/schemas/HumoAdapterStatusCode'
        data:
          $ref: '#/components/schemas/ReconcileAuthorizeResponse'
    ReconcileConfirmRequest:
      type: object
      description: Request to confirm a previously authorized virtual terminal reconciliation (RECO)
      required:
      - payinstrRef
      - paymentRef
      - confirmed
      - finished
      - paymentOriginator
      properties:
        payinstrRef:
          type: string
          description: Reference of the payment instrument used
        paymentRef:
          type: string
          maxLength: 64
          description: Payment reference number used in the reconcileAuthorize request
        confirmed:
          type: boolean
          description: Confirms the reconciliation. Must be true to finalize the totals
        finished:
          type: boolean
          description: Marks the reconciliation as finished
        paymentOriginator:
          type: string
          description: Name of the payment originator (login)
    ReconcileConfirmResponse:
      type: object
      description: Result of the reconciliation confirmation request
      required:
      - paymentId
      - action
      properties:
        paymentId:
          type: integer
          format: int64
          description: Unique payment identifier in the Payment Server
        paymentRef:
          type: string
          maxLength: 64
          description: Payment reference number
        action:
          type: integer
          description: Payment Server action code. 10 means the reconciliation totals were finalized successfully
        details:
          type: object
          description: Reconciliation totals returned by the Processing Center
          properties:
            terminalId:
              type: string
              description: Terminal identifier
            ttl:
              type: string
              description: Time-to-live of the reconciliation session (minutes)
            ttlAction:
              type: string
              description: Time-to-live action code
            debitsNumber:
              type: string
              description: Number of debit transactions included in the reconciliation
            debitsAmount:
              type: string
              description: Total amount of debit transactions included in the reconciliation
            creditsReversalNumber:
              type: string
              description: Number of credit/reversal transactions included in the reconciliation
            creditsReversalAmount:
              type: string
              description: Total amount of credit/reversal transactions included in the reconciliation
            reconcileInfo:
              type: string
              description: Reconciliation information
    ReconcileConfirmResult:
      type: object
      description: Envelope of the reconcile confirm operation
      properties:
        requestId:
          type: string
          description: Request identifier the operation was processed with
        status:
          $ref: '#/components/schemas/HumoAdapterStatusCode'
        data:
          $ref: '#/components/schemas/ReconcileConfirmResponse'
    RefundPaymentRequest:
      type: object
      description: Request to return (refund) a finished payment identified by paymentId or paymentRef
      required:
      - merchantId
      - centreId
      - terminalId
      - paymentOriginator
      properties:
        paymentId:
          type: integer
          format: int64
          description: Unique payment identifier in the Payment Server
        paymentRef:
          type: string
          maxLength: 64
          description: Payment reference number
        merchantId:
          type: string
          maxLength: 15
          description: Merchant identifier
        centreId:
          type: string
          description: Bank identifier (filled in according to the bank correspondence table)
        terminalId:
          type: string
          maxLength: 8
          description: Terminal identifier
        paymentOriginator:
          type: string
          description: Name of the payment originator (login)
    RefundPaymentResult:
      type: object
      description: Envelope of the refund payment operation
      properties:
        requestId:
          type: string
          description: Request identifier the operation was processed with
        status:
          $ref: '#/components/schemas/HumoAdapterStatusCode'
    SmsCodeRequest:
      type: object
      description: Request to confirm the SMS code previously sent for the given card
      required:
      - pan
      - code
      properties:
        pan:
          type: string
          maxLength: 16
          description: Card PAN (Primary Account Number)
        code:
          type: string
          maxLength: 6
          description: Confirmation code. Valid for 1 minute
    SmsCodeResponse:
      type: object
      description: Result of the SMS code confirmation, carries the permanent permission token
      required:
      - message
      properties:
        message:
          type: string
          maxLength: 256
          description: Confirmation message
        token:
          type: string
          maxLength: 12
          description: Permanent permission token without an expiry
    SmsCodeResult:
      type: object
      description: Envelope of the /v1/send/code operation
      properties:
        requestId:
          type: string
          description: Request identifier the operation was processed with
        status:
          $ref: '#/components/schemas/HumoAdapterStatusCode'
        data:
          $ref: '#/components/schemas/SmsCodeResponse'
    SmsSendRequest:
      type: object
      description: Request to send an SMS confirmation code to the supplied phone number
      required:
      - pan
      - msisdn
      properties:
        pan:
          type: string
          maxLength: 16
          description: Card PAN (Primary Account Number)
        msisdn:
          type: string
          maxLength: 13
          description: Customer's phone number in international format
        hash:
          type: string
          description: Hash code for auto reading the OTP on the device
        serviceName:
          type: string
          description: Name of the sender shown to the recipient
        expiry:
          type: string
          maxLength: 4
          description: Card expiry date (YYMM)
    SmsSendResponse:
      type: object
      description: Result of the send SMS request
      required:
      - message
      properties:
        message:
          type: string
          maxLength: 256
          description: Confirmation message
        maskedMsisdn:
          type: string
          maxLength: 13
          description: Masked phone number the code was sent to
    SmsSendResult:
      type: object
      description: Envelope of the /v1/send/sms operation
      properties:
        requestId:
          type: string
          description: Request identifier the operation was processed with
        status:
          $ref: '#/components/schemas/HumoAdapterStatusCode'
        data:
          $ref: '#/components/schemas/SmsSendResponse'
    P2pAuthorizeRequest:
      type: object
      description: P2P authorization, the Payment Server's Request (HUMOPAYMENT.pdf §2 p.5, §2.1 p.6)
      required:
      - language
      - switchingId
      - autoSwitch
      - paymentRef
      - pan
      - expiry
      - pan2
      - amount
      - ccyCode
      - merchantId
      - terminalId
      - paymentOriginator
      properties:
        language:
          type: string
          description: Language code, for example en
        switchingId:
          type: string
          description: 'Root switching identifier, sent as switchingID/value: 48 in-bank, 50 inter-bank, 77 with co-badge
            cards (199 on the test stand)

            '
        autoSwitch:
          type: string
          description: Automatic switching happens only when 1 is sent
        paymentRef:
          type: string
          maxLength: 64
          description: 'The sender''s unique, alphanumeric payment identifier (a UUID, for example); the status can
            be asked by it when no answer came

            '
        pan:
          type: string
          maxLength: 16
          description: Sender card PAN
        expiry:
          type: string
          maxLength: 4
          description: Sender card expiry (YYMM)
        pan2:
          type: string
          maxLength: 16
          description: Receiver card PAN
        amount:
          type: string
          maxLength: 12
          pattern: '^[0-9]{1,12}$'
          description: Amount in minor units (tiyin), digits only, at most 999999999999
        ccyCode:
          type: string
          maxLength: 3
          description: Currency numeric code, 860 for UZS
        merchantId:
          type: string
          maxLength: 15
          description: Merchant identifier
        terminalId:
          type: string
          maxLength: 8
          description: Terminal identifier
        paymentOriginator:
          type: string
          description: Name of the payment originator (login)
    P2pConfirmRequest:
      type: object
      description: P2P confirmation by the authorization's paymentRef (HUMOPAYMENT.pdf §2.2 p.8)
      required:
      - paymentRef
      - confirmed
      - finished
      - paymentOriginator
      properties:
        paymentRef:
          type: string
          maxLength: 64
          description: paymentRef of the P2P authorization
        confirmed:
          type: boolean
          description: Confirms the transfer, true
        finished:
          type: boolean
          description: Finishes the transfer, true
        paymentOriginator:
          type: string
          description: Name of the payment originator (login)
    P2pResponse:
      type: object
      description: 'The Payment Server''s answer to a P2P authorization (RequestResponse, action 4) or confirmation
        (PaymentResponse, action 10); the confirmation adds both legs'' authorization details

        '
      required:
      - paymentId
      - action
      properties:
        sessionId:
          type: string
          description: Payment Server session (sessionID), authorization only
        paymentId:
          type: integer
          format: int64
          description: Unique payment identifier in the Payment Server
        paymentRef:
          type: string
          maxLength: 64
          description: Payment reference number
        action:
          type: integer
          description: 4 = authorized, waits for confirmation; 10 = confirmed
        paymentInstruments:
          type: array
          description: Payment instruments used (paymentInstruments/item), authorization only
          items:
            $ref: '#/components/schemas/PaymentInstrument'
        details:
          type: object
          description: Payment attributes returned by the Processing Center
          properties:
            pan:
              type: string
              description: Sender card PAN (pan)
            expiry:
              type: string
              description: Sender card expiry, YYMM (expiry)
            pan2:
              type: string
              description: Receiver card PAN (pan2)
            amount:
              type: string
              description: Amount in tiyin (amount)
            ccyCode:
              type: string
              description: Currency numeric code (ccy_code)
            merchantId:
              type: string
              description: Merchant identifier (merchant_id)
            terminalId:
              type: string
              description: Terminal identifier (terminal_id)
            internalPanMasked:
              type: string
              description: Masked sender PAN (internal_pan_masked)
            internalPan2Masked:
              type: string
              description: Masked receiver PAN (internal_pan2_masked)
            fld126P2pr:
              type: string
              description: Field 126 P2PR (fld_126_P2PR)
            amountFee:
              type: string
              description: Amount with fee (amount_fee)
            merchantName:
              type: string
              description: Merchant name (merchant_name)
            pointCode:
              type: string
              description: Point of service code (point_code)
            transactionAmount:
              type: string
              description: Transaction amount (transaction_amount)
            cardholderAmount:
              type: string
              description: Cardholder billing amount (cardholder_amount)
            cardholderCcyCode:
              type: string
              description: Cardholder billing currency (cardholder_ccy_code)
            conversionRate:
              type: string
              description: Conversion rate (conversion_rate)
            authActionCode:
              type: string
              description: Debit leg action code (auth_action_code)
            authActionCodeFinal:
              type: string
              description: Final action code (auth_action_code_final)
            authApprCode:
              type: string
              description: Debit leg approval code (auth_appr_code)
            authRefNumber:
              type: string
              description: Debit leg reference number (auth_ref_number)
            authStan:
              type: string
              description: Debit leg STAN (auth_stan)
            authTime:
              type: string
              description: Debit leg time, YYYYMMDDHHMMSS (auth_time)
            stipClientId:
              type: string
              description: STIP client identifier (stip_client_id)
            cardType:
              type: string
              description: Sender card type (card_type)
            acqInst:
              type: string
              description: Acquirer institution (acq_inst)
            authRowNumb1:
              type: string
              description: Debit leg row number (auth_row_numb1)
            reconcileInfo:
              type: string
              description: Reconciliation information (reconcile_info)
            issRefData:
              type: string
              description: Issuer reference data (iss_ref_data)
            authMsgRef1:
              type: string
              description: Debit leg message reference (auth_msg_ref1)
            authActionCode2:
              type: string
              description: Credit leg action code (auth_action_code2)
            authApprCode2:
              type: string
              description: Credit leg approval code (auth_appr_code2)
            authRefNumber2:
              type: string
              description: Credit leg reference number (auth_ref_number2)
            authStan2:
              type: string
              description: Credit leg STAN (auth_stan2)
            authTime2:
              type: string
              description: Credit leg time (auth_time2)
            cardType2:
              type: string
              description: Receiver card type (card_type2)
            merchantName2:
              type: string
              description: Credit leg merchant name (merchant_name2)
            acqInst2:
              type: string
              description: Credit leg acquirer institution (acq_inst2)
            authRowNumb3:
              type: string
              description: Credit leg row number (auth_row_numb3)
            reconcileInfo2:
              type: string
              description: Credit leg reconciliation information (reconcile_info2)
            issRefData2:
              type: string
              description: Credit leg issuer reference data (iss_ref_data2)
            authMsgRef3:
              type: string
              description: Credit leg message reference (auth_msg_ref3)
    P2pResult:
      type: object
      description: Envelope of the P2P authorize and confirm operations
      properties:
        requestId:
          type: string
          description: Request identifier the operation was processed with
        status:
          $ref: '#/components/schemas/HumoAdapterStatusCode'
        data:
          $ref: '#/components/schemas/P2pResponse'
    PaymentInstrument:
      type: object
      description: One paymentInstruments item
      properties:
        label:
          type: string
          description: Instrument label
        reference:
          type: string
          description: Instrument reference
    CreditToCardRequest:
      type: object
      description: 'SOAP_TOCARD_2 credit, the Payment Server''s Request (HUMOPAYMENT.pdf §4 p.27–29). The sender_*
        fields go on as details; sender_retrieval_ref_number, sender_person_code and sender_pan are what terminals
        xx66xxxx need.

        '
      required:
      - billerRef
      - payinstrRef
      - paymentRef
      - pan2
      - expiry
      - ccyCode
      - amount
      - merchantId
      - terminalId
      - senderRetrievalRefNumber
      - senderSurname
      - senderPan
      - senderFirstName
      - paymentOriginator
      properties:
        billerRef:
          type: string
          description: Biller to pay, SOAP_TOCARD_2
        payinstrRef:
          type: string
          description: Payment instrument, SOAP_TOCARD_2
        sessionId:
          type: string
          description: Payment Server session identifier; the PDF's table marks it M, its example leaves it out
        paymentRef:
          type: string
          maxLength: 64
          description: The sender's unique payment identifier
        pan2:
          type: string
          maxLength: 16
          description: Card PAN to credit
        expiry:
          type: string
          maxLength: 4
          description: Card expiry (YYMM)
        ccyCode:
          type: string
          maxLength: 3
          description: Currency numeric code, 860 for UZS
        amount:
          type: string
          maxLength: 12
          pattern: '^[0-9]{1,12}$'
          description: Amount in minor units (tiyin), digits only, at most 999999999999
        merchantId:
          type: string
          maxLength: 15
          description: Merchant identifier
        terminalId:
          type: string
          maxLength: 8
          description: Terminal identifier
        centreId:
          type: string
          description: Bank identifier (centre_id); in the PDF's example, not its table
        senderRetrievalRefNumber:
          type: string
          maxLength: 12
          description: 'Sender''s payment identification number (sender_retrieval_ref_number). Required: the PDF''s table
            marks it M (p.27), its text says for terminals xx66xxxx'
        senderNationality:
          type: string
          maxLength: 3
          description: Sender citizenship, for example UZB or USA
        senderDocType:
          type: string
          maxLength: 3
          description: Sender document type, 001 passport, 002 driving licence, 003 insurance policy, NIC national id card
        senderSerialNo:
          type: string
          description: Sender document series; required above 50 BRV
        senderIdCard:
          type: string
          maxLength: 16
          description: Sender document number; required above 50 BRV
        senderDocValidthrough:
          type: string
          description: Sender document validity, YYYY-MM-DD
        senderPersonCode:
          type: string
          maxLength: 20
          description: 'Sender PINFL. Optional in the PDF''s table (p.27); its change history (v2.1, p.2) makes it mandatory
            for terminals xx66xxxx, so send it for those'
        senderSurname:
          type: string
          maxLength: 20
          description: Sender surname
        senderPan:
          type: string
          maxLength: 16
          description: 'Sender card PAN. Required: the PDF''s table marks it M (p.27), its text and change history say
            for terminals xx66xxxx'
        senderFirstName:
          type: string
          maxLength: 34
          description: Sender first name
        senderMiddleName:
          type: string
          maxLength: 20
          description: Sender middle name
        senderBirthDate:
          type: string
          description: Sender birth date, YYYY-MM-DD
        paymentOriginator:
          type: string
          description: Name of the payment originator (login)
    CreditToCardResponse:
