        lockedBackofficeAmount:
          type: number
          description: Amount locked by the back office in minor units
        lockTime:
          type: string
          description: Time of the last lock
        lockedAmount:
          type: number
          description: Lock sum from STIP locks in minor units
        shadowAmount:
          type: number
          description: Shadow amount in minor units
        commissionGroup:
          type: string
          description: Commission group of the account
        timestamp:
          type: string
          description: Record time stamp (TIME_STAMP)
        priority:
