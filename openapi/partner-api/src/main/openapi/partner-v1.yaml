# Partner API: what clients may ask the partner module.
openapi: 3.0.3
info:
  title: Partner API
  version: "1"
paths:
  /api/v1/partners/{id}:
    get:
      tags: [Partners]
      operationId: getPartner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerResponse" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/registrations:
    post:
      tags: [Registration]
      operationId: register
      summary: Register a merchant and email it a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "201":
          description: Registered, pending email verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/registrations/email-verification:
    post:
      tags: [Registration]
      operationId: verifyEmail
      summary: Prove ownership of the email with the one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailVerificationRequest" }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /api/v1/registrations/email-verification/resend:
    post:
      tags: [Registration]
      operationId: resendCode
      summary: Send a new one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendCodeRequest" }
      responses:
        "202": { description: A new code was sent }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/verify:
    post:
      tags: [PartnerAdmin]
      operationId: verifyPartner
      summary: Documents checked; the partner moves on to waiting for a contract
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/AdminId" }]
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/reject:
    post:
      tags: [PartnerAdmin]
      operationId: rejectPartner
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/AdminId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/contract:
    post:
      tags: [PartnerAdmin]
      operationId: signContract
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/AdminId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractRequest" }
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/activation-requests:
    post:
      tags: [ActivationRequests]
      operationId: requestActivation
      summary: One admin asks to switch an approved partner on; another admin must approve
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/AdminId" }]
      responses:
        "201": { $ref: "#/components/responses/ActivationRequest" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/activation-requests/{requestId}/approve:
    post:
      tags: [ActivationRequests]
      operationId: approveActivation
      summary: A second admin approves; the partner becomes active
      parameters: [{ $ref: "#/components/parameters/RequestId" }, { $ref: "#/components/parameters/AdminId" }]
      responses:
        "200": { $ref: "#/components/responses/ActivationRequest" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/activation-requests/{requestId}/reject:
    post:
      tags: [ActivationRequests]
      operationId: rejectActivation
      parameters: [{ $ref: "#/components/parameters/RequestId" }, { $ref: "#/components/parameters/AdminId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/ActivationRequest" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/suspend:
    post:
      tags: [PartnerAdmin]
      operationId: suspendPartner
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/AdminId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/restore:
    post:
      tags: [PartnerAdmin]
      operationId: restorePartner
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/AdminId" }]
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/terminate:
    post:
      tags: [PartnerAdmin]
      operationId: terminatePartner
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/AdminId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/history:
    get:
      tags: [PartnerAdmin]
      operationId: getPartnerHistory
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      responses:
        "200":
          description: Every status change, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusChangeResponse" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  parameters:
    PartnerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminId:
      name: X-Admin-Id
      in: header
      required: true
      description: The admin making the change
      schema: { type: string, minLength: 1, maxLength: 64 }
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
  responses:
    ActivationRequest:
      description: The activation request after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ActivationRequestResponse" }
    Partner:
      description: The partner after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PartnerResponse" }
    Problem:
      description: RFC 9457 problem detail with a stable error code
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    PartnerResponse:
      type: object
      required: [id, companyName, status, emailVerified]
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        status:
          type: string
          enum: [PENDING_VERIFICATION, VERIFIED, WAITING_CONTRACT, APPROVED, ACTIVE, SUSPENDED, TERMINATED, REJECTED]
        emailVerified: { type: boolean }
        contractNumber: { type: string }
    RegistrationRequest:
      type: object
      required: [companyName, email]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email, maxLength: 320 }
    EmailVerificationRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }
    ResendCodeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    ContractRequest:
      type: object
      required: [contractNumber]
      properties:
        contractNumber: { type: string, minLength: 3, maxLength: 64 }
    StatusChangeResponse:
      type: object
      required: [fromStatus, toStatus, changedBy, changedAt]
      properties:
        fromStatus: { type: string }
        toStatus: { type: string }
        changedBy: { type: string }
        reason: { type: string }
        changedAt: { type: string, format: date-time }
    ActivationRequestResponse:
      type: object
      required: [id, partnerId, status, requestedBy, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED] }
        requestedBy: { type: string }
        decidedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }
        code: { type: string }
