# Partner API: what clients may ask the partner module.
openapi: 3.0.3
info:
  title: Partner API
  version: "1"
security:
  - bearer: []

paths:
  /api/v1/partners/{id}:
    get:
      tags: [Partners]
      operationId: getPartner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/me:
    get:
      tags: [PartnerSelf]
      operationId: getMe
      summary: The signed-in partner
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/clients:
    get:
      tags: [PartnerSelf]
      operationId: listClients
      summary: The partner's API clients; secrets are never shown again
      responses:
        "200":
          description: API clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiClientResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [PartnerSelf]
      operationId: createClient
      summary: Creates a machine-to-machine client; the secret is shown only in this response
      responses:
        "201": { $ref: "#/components/responses/ApiClientSecret" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/clients/{clientId}/secret:
    post:
      tags: [PartnerSelf]
      operationId: rotateClientSecret
      summary: Issues a new secret; the old one stops working at once
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ApiClientSecret" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/sales-points:
    get:
      tags: [SalesPoints]
      operationId: listMySalesPoints
      summary: The signed-in partner's websites that take payments
      responses:
        "200":
          description: Sales points, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalesPointResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [SalesPoints]
      operationId: createSalesPoint
      summary: Adds a website as a draft; the bank checks it before it can take payments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesPointRequest" }
      responses:
        "201": { $ref: "#/components/responses/SalesPoint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/sales-points/{salesPointId}/return-urls:
    put:
      tags: [SalesPoints]
      operationId: updateReturnUrls
      summary: Where buyers may be sent back after paying; only while the sales point is a draft
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnUrlsRequest" }
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/sales-points/{salesPointId}/webhook:
    put:
      tags: [SalesPoints]
      operationId: updateWebhook
      summary: Where the bank tells the website how each payment ended; empty to stop
      description: An https address on the website's own domain. Each call is signed with the API client's signing key.
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookRequest" }
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/sales-points:
    get:
      tags: [SalesPointAdmin]
      operationId: listPartnerSalesPoints
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      responses:
        "200":
          description: The partner's sales points, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalesPointResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}:
    get:
      tags: [SalesPointAdmin]
      operationId: getSalesPoint
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}/site-checks:
    get:
      tags: [SalesPointAdmin]
      operationId: listSiteChecks
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      responses:
        "200":
          description: Every check of the website, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteCheckResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [SalesPointAdmin]
      operationId: recordSiteCheck
      summary: Records what an admin found on the website
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteCheckRequest" }
      responses:
        "201":
          description: The recorded check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteCheckResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}/settings:
    put:
      tags: [SalesPointAdmin]
      operationId: updateSalesPointSettings
      summary: The terms of the deal for this website
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesPointSettingsRequest" }
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}/activate:
    post:
      tags: [SalesPointAdmin]
      operationId: activateSalesPoint
      summary: Lets the website take payments; needs an active partner and a passed site check
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}/suspend:
    post:
      tags: [SalesPointAdmin]
      operationId: suspendSalesPoint
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}/restore:
    post:
      tags: [SalesPointAdmin]
      operationId: restoreSalesPoint
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}/close:
    post:
      tags: [SalesPointAdmin]
      operationId: closeSalesPoint
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/registrations:
    post:
      tags: [Registration]
      operationId: register
      security: []
      summary: Register a merchant and email it a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "201":
          description: Registered, pending email verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/registrations/email-verification:
    post:
      tags: [Registration]
      operationId: verifyEmail
      security: []
      summary: Prove ownership of the email with the one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailVerificationRequest" }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /api/v1/registrations/email-verification/resend:
    post:
      tags: [Registration]
      operationId: resendCode
      security: []
      summary: Send a new one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendCodeRequest" }
      responses:
        "202": { description: A new code was sent }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners:
    get:
      tags: [PartnerAdmin]
      operationId: listPartners
      summary: Partners, newest first, filtered by status and searched by company name or email
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/PartnerStatus" } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: One page of partners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/activation-requests:
    get:
      tags: [ActivationRequests]
      operationId: listActivationRequests
      summary: Activation requests waiting for a second admin, oldest first
      responses:
        "200":
          description: Waiting requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivationRequestResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/verify:
    post:
      tags: [PartnerAdmin]
      operationId: verifyPartner
      summary: Documents checked; the partner moves on to waiting for a contract
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/reject:
    post:
      tags: [PartnerAdmin]
      operationId: rejectPartner
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/contract:
    post:
      tags: [PartnerAdmin]
      operationId: signContract
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractRequest" }
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/activation-requests:
    post:
      tags: [ActivationRequests]
      operationId: requestActivation
      summary: One admin asks to switch an approved partner on; another admin must approve
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      responses:
        "201": { $ref: "#/components/responses/ActivationRequest" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/activation-requests/{requestId}/approve:
    post:
      tags: [ActivationRequests]
      operationId: approveActivation
      summary: A second admin approves; the partner becomes active
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200": { $ref: "#/components/responses/ActivationRequest" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/activation-requests/{requestId}/reject:
    post:
      tags: [ActivationRequests]
      operationId: rejectActivation
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/ActivationRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/suspend:
    post:
      tags: [PartnerAdmin]
      operationId: suspendPartner
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/restore:
    post:
      tags: [PartnerAdmin]
      operationId: restorePartner
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/terminate:
    post:
      tags: [PartnerAdmin]
      operationId: terminatePartner
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Partner" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/history:
    get:
      tags: [PartnerAdmin]
      operationId: getPartnerHistory
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      responses:
        "200":
          description: Every status change, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusChangeResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/documents:
    get:
      tags: [PartnerDocuments]
      operationId: listMyDocuments
      summary: The company documents the merchant uploaded, and what is still needed to be switched on
      responses:
        "200": { $ref: "#/components/responses/Documents" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [PartnerDocuments]
      operationId: uploadMyDocument
      summary: Uploads a document; one of the same type waiting or rejected is replaced
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { $ref: "#/components/schemas/DocumentType" }
                file: { type: string, format: binary, description: "PDF, PNG or JPEG, up to 10 MB" }
                description: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The document, waiting for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/documents/{documentId}/file:
    get:
      tags: [PartnerDocuments]
      operationId: downloadMyDocument
      parameters: [{ $ref: "#/components/parameters/DocumentId" }]
      responses:
        "200": { $ref: "#/components/responses/File" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/partner/sales-points/{salesPointId}/logo:
    get:
      tags: [SalesPoints]
      operationId: getMySalesPointLogo
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      responses:
        "200": { $ref: "#/components/responses/Image" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [SalesPoints]
      operationId: uploadMySalesPointLogo
      summary: The logo buyers see on the payment page; PNG or JPEG, up to 1 MB
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/SalesPoint" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/documents:
    get:
      tags: [PartnerDocumentsAdmin]
      operationId: listPartnerDocuments
      summary: Every document the merchant uploaded, newest first, and where KYB stands
      parameters: [{ $ref: "#/components/parameters/PartnerId" }]
      responses:
        "200": { $ref: "#/components/responses/Documents" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/documents/{documentId}/file:
    get:
      tags: [PartnerDocumentsAdmin]
      operationId: downloadPartnerDocument
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/DocumentId" }]
      responses:
        "200": { $ref: "#/components/responses/File" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/documents/{documentId}/verify:
    post:
      tags: [PartnerDocumentsAdmin]
      operationId: verifyPartnerDocument
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/DocumentId" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/partners/{id}/documents/{documentId}/reject:
    post:
      tags: [PartnerDocumentsAdmin]
      operationId: rejectPartnerDocument
      parameters: [{ $ref: "#/components/parameters/PartnerId" }, { $ref: "#/components/parameters/DocumentId" }]
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/sales-points/{salesPointId}/logo:
    get:
      tags: [SalesPointAdmin]
      operationId: getSalesPointLogo
      parameters: [{ $ref: "#/components/parameters/SalesPointId" }]
      responses:
        "200": { $ref: "#/components/responses/Image" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token from realm ecom
  parameters:
    PartnerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SalesPointId:
      name: salesPointId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
  responses:
    Documents:
      description: The documents and where KYB stands
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PartnerDocumentsResponse" }
    Document:
      description: The document after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DocumentResponse" }
    File:
      description: The file, as an attachment
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    Image:
      description: The image
      content:
        image/*:
          schema: { type: string, format: binary }
    SalesPoint:
      description: The sales point after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SalesPointResponse" }
    ApiClientSecret:
      description: The client and its secret, shown once
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiClientSecretResponse" }
    ActivationRequest:
      description: The activation request after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ActivationRequestResponse" }
    Partner:
      description: The partner after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PartnerResponse" }
    Problem:
      description: RFC 9457 problem detail with a stable error code
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    PartnerResponse:
      type: object
      required: [id, companyName, email, status, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        companyName: { type: string }
        email: { type: string, format: email }
        status: { $ref: "#/components/schemas/PartnerStatus" }
        emailVerified: { type: boolean }
        contractNumber: { type: string }
        createdAt: { type: string, format: date-time }
    PartnerStatus:
      type: string
      enum: [PENDING_VERIFICATION, VERIFIED, WAITING_CONTRACT, APPROVED, ACTIVE, SUSPENDED, TERMINATED, REJECTED]
    PartnerPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PartnerResponse" }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    RegistrationRequest:
      type: object
      required: [companyName, email, password]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 12, maxLength: 128, description: Stored only in Keycloak }
    EmailVerificationRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }
    ResendCodeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    ContractRequest:
      type: object
      required: [contractNumber]
      properties:
        contractNumber: { type: string, minLength: 3, maxLength: 64 }
    StatusChangeResponse:
      type: object
      required: [fromStatus, toStatus, changedBy, changedAt]
      properties:
        fromStatus: { type: string }
        toStatus: { type: string }
        changedBy: { type: string }
        reason: { type: string }
        changedAt: { type: string, format: date-time }
    ActivationRequestResponse:
      type: object
      required: [id, partnerId, status, requestedBy, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        companyName: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED] }
        requestedBy: { type: string }
        decidedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ApiClientResponse:
      type: object
      required: [clientId, createdAt, signingKeyConfigured]
      properties:
        clientId: { type: string }
        createdAt: { type: string, format: date-time }
        signingKeyConfigured: { type: boolean, description: "Whether the bank has put this client's request-signing key into Vault; payments need it" }
        secretRotatedAt: { type: string, format: date-time }
    ApiClientSecretResponse:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId: { type: string }
        clientSecret: { type: string, description: Gets the access token (client credentials) }
    CardScheme:
      type: string
      enum: [UZCARD, HUMO]
    SalesPointStatus:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, CLOSED]
    SalesPointRequest:
      type: object
      required: [name, websiteUrl, returnUrls]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        websiteUrl: { type: string, maxLength: 255, pattern: "^https://.+", example: "https://shop.example.uz" }
        returnUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 500, pattern: "^https://.+" }
    WebhookRequest:
      type: object
      properties:
        url: { type: string, maxLength: 500, description: "Empty or absent stops the webhooks" }
    ReturnUrlsRequest:
      type: object
      required: [returnUrls]
      properties:
        returnUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 500, pattern: "^https://.+" }
    SalesPointSettingsRequest:
      type: object
      required: [schemes, refundWindowDays]
      properties:
        schemes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/CardScheme" }
        refundWindowDays: { type: integer, minimum: 0, description: Days after a payment when it can still be refunded }
        extendedRefundDays: { type: integer, minimum: 1, description: Extra days agreed with the bank; needs a reason }
        extendedRefundReason: { type: string, minLength: 3, maxLength: 500 }
    SalesPointResponse:
      type: object
      required: [id, partnerId, name, websiteUrl, returnUrls, status, schemes, refundWindowDays, createdAt]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        name: { type: string }
        websiteUrl: { type: string }
        returnUrls:
          type: array
          items: { type: string }
        status: { $ref: "#/components/schemas/SalesPointStatus" }
        schemes:
          type: array
          items: { $ref: "#/components/schemas/CardScheme" }
        refundWindowDays: { type: integer }
        extendedRefundDays: { type: integer }
        extendedRefundReason: { type: string }
        statusReason: { type: string }
        lastSiteCheck: { $ref: "#/components/schemas/SiteCheckResponse" }
        logoUpdatedAt: { type: string, format: date-time, description: Set once the website has a logo }
        webhookUrl: { type: string, description: Where the bank tells the website how each payment ended }
        createdAt: { type: string, format: date-time }
    DocumentType:
      type: string
      description: "CHARTER the company's charter · LICENSE a licence for regulated activity · PASSPORT the director's ID · POWER_OF_ATTORNEY for someone acting for the director"
      enum: [CHARTER, LICENSE, PASSPORT, POWER_OF_ATTORNEY]
    DocumentStatus:
      type: string
      description: UPLOADED waits for the bank · VERIFIED checked · REJECTED needs a new upload · REPLACED superseded by a newer upload
      enum: [UPLOADED, VERIFIED, REJECTED, REPLACED]
    DocumentResponse:
      type: object
      required: [id, type, status, fileName, contentType, size, sha256, uploadedBy, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/DocumentType" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        description: { type: string }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        reviewedBy: { type: string }
        reviewedAt: { type: string, format: date-time }
        rejectReason: { type: string }
    KybStatus:
      type: string
      description: "APPROVED every required document is verified · IN_REVIEW all are uploaded, some wait for the bank · ACTION_REQUIRED some are missing or rejected"
      enum: [ACTION_REQUIRED, IN_REVIEW, APPROVED]
    KybResponse:
      type: object
      required: [status, required, missing, waiting]
      properties:
        status: { $ref: "#/components/schemas/KybStatus" }
        required:
          type: array
          items: { $ref: "#/components/schemas/DocumentType" }
        missing:
          type: array
          description: Required types with no document, or only a rejected one
          items: { $ref: "#/components/schemas/DocumentType" }
        waiting:
          type: array
          description: Required types uploaded and waiting for the bank
          items: { $ref: "#/components/schemas/DocumentType" }
    PartnerDocumentsResponse:
      type: object
      required: [kyb, documents]
      properties:
        kyb: { $ref: "#/components/schemas/KybResponse" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/DocumentResponse" }
    SiteCheckResult:
      type: string
      enum: [PASSED, FAILED]
    SiteCheckRequest:
      type: object
      required: [result, findings]
      properties:
        result: { $ref: "#/components/schemas/SiteCheckResult" }
        findings:
          type: array
          maxItems: 20
          description: What the admin saw, one line each; required when the check fails
          items: { type: string, minLength: 3, maxLength: 300 }
    SiteCheckResponse:
      type: object
      required: [id, result, findings, checkedBy, checkedAt]
      properties:
        id: { type: string, format: uuid }
        result: { $ref: "#/components/schemas/SiteCheckResult" }
        findings:
          type: array
          items: { type: string }
        checkedBy: { type: string }
        checkedAt: { type: string, format: date-time }
    Problem:
      type: object
      description: RFC 9457 problem detail. `code` is stable and meant for programs; `detail` is for people.
      required: [status, title, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, example: PARTNER_EMAIL_TAKEN }
        errors:
          type: array
          description: Only for VALIDATION_FAILED, one entry per invalid field
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
