# Payment API: a merchant's server creates payments, the buyer pays on the bank's page, and the bank's admins see them.
openapi: 3.0.3
info:
  title: Payment API
  version: "1"
  description: |
    Merchant calls need an access token from the merchant's API client (client credentials) and an
    RFC 9421 HTTP Message Signature with the algorithm hmac-sha256, keyed with the API client's
    signing key (base64-decoded). The signature covers "@method", "@target-uri", "authorization",
    and "content-digest" when there is a body, with the parameters created (Unix seconds, within
    the configured window), nonce (random, used once), keyid (the API client's id) and
    alg="hmac-sha256". The body's hash goes in Content-Digest (RFC 9530) as sha-256=:<base64>:.
    Example: Signature-Input: sig1=("@method" "@target-uri" "authorization" "content-digest");
    created=1760000000;nonce="3f2a…";keyid="ecom-1a2b…";alg="hmac-sha256", and
    Signature: sig1=:<base64 HMAC of the signature base>:. Any RFC 9421 library builds the base.

    The payment page calls (`/api/v1/pay/{token}`) need no login: the one-time token in the link is
    the only credential, and it works until the page expires.

    Payment links (`/api/v1/partner/payment-links`) are made by a merchant's user in the portal: the
    same page, for buyers reached in a chat, with no website checkout and no return address.

    Webhooks: when a payment ends (PAID, DECLINED, FAILED, EXPIRED), its money goes back (REVERSED,
    REFUNDED), a refund fails, or a dispute is opened, won or lost, the bank POSTs a WebhookEvent as JSON to the website's webhook URL, signed with
    the API client's key the Standard Webhooks way (standardwebhooks.com): webhook-id is the event's
    id, webhook-timestamp the Unix time it was sent, and webhook-signature is "v1," and the base64
    HMAC-SHA256 of "webhook-id.webhook-timestamp.body". Any Standard Webhooks library verifies it
    with the key. The same event may arrive more than once; drop repeats by webhook-id. Anything
    but a 2xx within the timeout is retried, waiting longer each time, for 24 hours; one payment's
    events arrive in order. listPaymentWebhooks shows each attempt, and replayPaymentWebhook sends an
    event again.
security:
  - bearer: []

paths:
  /api/v1/payments:
    post:
      tags: [Payment]
      operationId: createPayment
      summary: Creates a payment and a one-time link to the bank's payment page
      description: Retrying with the same Idempotency-Key and body returns the first response; no second payment is made.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/SignatureInput" }
        - { $ref: "#/components/parameters/Signature" }
        - { $ref: "#/components/parameters/ContentDigest" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: The payment, with its payment page link
          headers:
            Idempotent-Replayed: { description: "true when this is the stored response to an earlier request", schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "503": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/payments/{paymentId}:
    get:
      tags: [Payment]
      operationId: getPayment
      summary: One of the merchant's payments
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/SignatureInput" }
        - { $ref: "#/components/parameters/Signature" }
        - { $ref: "#/components/parameters/ContentDigest" }
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/payment-links:
    post:
      tags: [PaymentLink]
      operationId: createPaymentLink
      summary: A payment link for one of the merchant's live websites, to send to a buyer in a chat
      description: The link opens the bank's payment page. It is shown only in this response; the bank keeps only its hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkRequest" }
      responses:
        "201":
          description: The payment behind the link, with the link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinkResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
    get:
      tags: [PaymentLink]
      operationId: listPaymentLinks
      summary: The merchant's latest payment links, newest first
      parameters:
        - { name: salesPointId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Up to 100 links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentLinkResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/payments/{paymentId}/refund:
    post:
      tags: [Payment]
      operationId: refundPayment
      summary: Gives a paid payment back to the card, all of it
      description: >-
        The whole amount only. On the day it was paid (in the bank's settlement time zone) the debit is
        reversed before settlement (REVERSED); later, within the website's refund window (10 working
        days, or an approved extension in calendar days), it is refunded (REFUNDED). At most
        10 000 000 UZS here (PAYMENT_REFUND_CAP_EXCEEDED); above it, or after the window
        (PAYMENT_REFUND_WINDOW_CLOSED), the bank's staff refund on the merchant's application. No
        answer from the scheme leaves it RETURNING while the bank asks the scheme; it is never sent
        twice. A DISPUTED payment is refunded by the same rules; a full refund, by the merchant or by
        the bank's staff on its application, resolves its open dispute (RESOLVED_BY_REFUND).
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/SignatureInput" }
        - { $ref: "#/components/parameters/Signature" }
        - { $ref: "#/components/parameters/ContentDigest" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "200":
          description: The payment, REVERSED, REFUNDED or RETURNING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/payment-links/{paymentId}/refund:
    post:
      tags: [PaymentLink]
      operationId: refundPaymentLink
      summary: Gives a paid payment link back to the card, by the same rules as refundPayment
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "200":
          description: The link, REVERSED, REFUNDED or RETURNING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinkResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/reports:
    get:
      tags: [PaymentReport]
      operationId: listDailyReports
      summary: The merchant's daily reports, newest first, one row per website and business day
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "First business day; default 30 days ago" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last business day; default yesterday" }
      responses:
        "200":
          description: Up to 100 rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyReport" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/reports/{day}/payments.csv:
    get:
      tags: [PaymentReport]
      operationId: downloadDailyPayments
      summary: Every payment and refund behind one business day's reports, as CSV
      parameters:
        - { name: day, in: path, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: "UTF-8 CSV: kind, payment id, order, website, amount, fee, net, card, RRN, time"
          content:
            text/csv:
              schema: { type: string, format: binary }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/payments:
    get:
      tags: [PaymentAdmin]
      operationId: listPayments
      summary: The latest payments, newest first
      parameters:
        - { name: partnerId, in: query, schema: { type: string, format: uuid } }
        - { name: salesPointId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Up to 100 payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentAdminResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/payments/review:
    get:
      tags: [PaymentAdmin]
      operationId: listPaymentsToReview
      summary: Payments the scheme left without an answer, oldest first
      description: >-
        UNKNOWN (the bank is still asking the scheme about the debit), MANUAL_REVIEW (a person
        decides the debit) and RETURNING (a reversal or refund the scheme hasn't confirmed: the bank
        asks while it can, then a person decides).
      responses:
        "200":
          description: Up to 100 payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentAdminResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/payments/{paymentId}/resolution:
    post:
      tags: [PaymentAdmin]
      operationId: resolvePayment
      summary: "A person's decision on a MANUAL_REVIEW or RETURNING payment, after checking with the scheme"
      description: >-
        For MANUAL_REVIEW (a debit): NOT_DEBITED: the payment is DECLINED. DEBITED: the payment is
        PAID while its page is still open; once the page has closed the money goes back to the card
        (reversed on the day it was taken, refunded later) with the scheme's reference for the
        debit. For RETURNING (a reversal or refund the scheme didn't answer): RETURNED: the payment
        is REVERSED or REFUNDED; NOT_RETURNED: it stays PAID and the merchant is told the refund
        failed. Every decision needs a note, is audited, and sends the merchant one webhook.
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentResolutionRequest" }
      responses:
        "200":
          description: The payment, as decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentAdminResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/pay/{token}:
    get:
      tags: [PaymentPage]
      operationId: getPaymentPage
      summary: What the buyer sees on the payment page; reading it changes nothing
      security: []
      parameters: [{ $ref: "#/components/parameters/PageToken" }]
      responses:
        "200":
          description: The payment page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "410": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/pay/{token}/logo:
    get:
      tags: [PaymentPage]
      operationId: getPaymentPageLogo
      summary: The website's logo
      security: []
      parameters: [{ $ref: "#/components/parameters/PageToken" }]
      responses:
        "200":
          description: PNG or JPEG
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "410": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/pay/{token}/card:
    post:
      tags: [PaymentPage]
      operationId: submitPaymentCard
      summary: The buyer's card; its scheme sends a one-time code to the cardholder's phone
      description: Every attempt counts, failed ones too; after the configured number the page closes.
      security: []
      parameters: [{ $ref: "#/components/parameters/PageToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCardRequest" }
      responses:
        "200":
          description: The page, now waiting for the code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "410": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "503": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/pay/{token}/code:
    post:
      tags: [PaymentPage]
      operationId: confirmPaymentCode
      summary: The one-time code from the cardholder's phone; a right code confirms the card
      description: Every attempt counts; after the configured number for this card the page closes.
      security: []
      parameters: [{ $ref: "#/components/parameters/PageToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCodeRequest" }
      responses:
        "200":
          description: The page, with the card confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPage" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "410": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "503": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/payments:
    get:
      tags: [PaymentCabinet]
      operationId: listCabinetPayments
      summary: The merchant's payments in its cabinet, newest first
      parameters:
        - { name: salesPointId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/PaymentState" } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day, in the settlement time zone" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day, included" }
      responses:
        "200":
          description: Up to 100 payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/payments/{paymentId}:
    get:
      tags: [PaymentCabinet]
      operationId: getCabinetPayment
      summary: One of the merchant's payments, with its operations and how long it can still be refunded
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/payments/{paymentId}/refund:
    post:
      tags: [PaymentCabinet]
      operationId: refundCabinetPayment
      summary: The merchant gives a payment back from its cabinet, by the same rules as refundPayment (a DISPUTED one too)
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "200":
          description: The payment, REVERSED, REFUNDED or RETURNING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  # ------- Webhooks: the delivery log and replay (FR-CHK-060…062) -------
  /api/v1/payments/{paymentId}/webhooks:
    get:
      tags: [Payment]
      operationId: listPaymentWebhooks
      summary: Every webhook event of the payment, oldest first, with each delivery attempt
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/SignatureInput" }
        - { $ref: "#/components/parameters/Signature" }
        - { $ref: "#/components/parameters/ContentDigest" }
      responses:
        "200":
          description: The events, empty when the website takes no webhooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookDeliveryResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/payments/{paymentId}/webhooks/{eventId}/replay:
    post:
      tags: [Payment]
      operationId: replayPaymentWebhook
      summary: Sends one event again, with the same webhook-id, as a new attempt
      description: >-
        The stored body goes again, signed anew, in its turn after any earlier event of the payment
        still being retried. While the event is still being retried, nothing new is queued. An event
        retried for 24 hours without a 2xx is undelivered; replay it once the website is back. A
        replayed event may arrive after later ones of the same payment: apply an event only when its
        occurredAt is newer than the last one applied, or read getPayment for the current state.
        PAYMENT_WEBHOOK_NOT_CONFIGURED (409) when the website has no webhook URL now, or the payment came
        from a payment link, which sends no webhooks.
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/EventId" }
        - { $ref: "#/components/parameters/SignatureInput" }
        - { $ref: "#/components/parameters/Signature" }
        - { $ref: "#/components/parameters/ContentDigest" }
      responses:
        "202":
          description: The event, with its next attempt due now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/payments/{paymentId}/webhooks:
    get:
      tags: [PaymentCabinet]
      operationId: listCabinetPaymentWebhooks
      summary: The webhook log of one of the merchant's payments in its cabinet, as listPaymentWebhooks
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      responses:
        "200":
          description: The events, empty when the website takes no webhooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookDeliveryResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/payments/{paymentId}/webhooks/{eventId}/replay:
    post:
      tags: [PaymentCabinet]
      operationId: replayCabinetPaymentWebhook
      summary: The merchant sends one event again from its cabinet, as replayPaymentWebhook
      parameters:
        - { $ref: "#/components/parameters/PaymentId" }
        - { $ref: "#/components/parameters/EventId" }
      responses:
        "202":
          description: The event, with its next attempt due now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  # ------- Disputes: complaints and scheme claims, handled by staff (FR-CHK-090…095) -------
  /api/v1/admin/payments/{paymentId}/disputes:
    post:
      tags: [DisputeAdmin]
      operationId: registerDispute
      summary: Staff register a complaint or a scheme claim on a PAID payment; the payment becomes DISPUTED
      description: >-
        The dispute starts REGISTERED, takes the scheme of the payment's card, is audited, and the
        merchant gets payment.disputed. PAYMENT_DISPUTE_STATE_INVALID (409) when the payment is not
        PAID (so at most one open dispute per payment). PAYMENT_DISPUTE_INVALID (422) when the
        amount is above the payment's, a SCHEME claim has no claimRef, receivedOn is in the future
        or the scheme deadline is before it.
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeRegisterRequest" }
      responses:
        "201":
          description: The dispute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/disputes:
    get:
      tags: [DisputeAdmin]
      operationId: listDisputes
      summary: The dispute queue, nearest deadline first
      description: Without a state, every dispute not yet CLOSED. dueSoon marks a deadline within 2 banking days.
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/DisputeState" } }
        - { name: partnerId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Up to 100 disputes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DisputeResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/disputes/{disputeId}:
    get:
      tags: [DisputeAdmin]
      operationId: getDispute
      summary: One dispute, with its evidence
      parameters: [{ $ref: "#/components/parameters/DisputeId" }]
      responses:
        "200":
          description: The dispute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/disputes/{disputeId}/evidence-request:
    post:
      tags: [DisputeAdmin]
      operationId: requestDisputeEvidence
      summary: Staff ask the merchant for evidence by a deadline; the dispute becomes EVIDENCE_REQUESTED
      description: >-
        From REGISTERED only, otherwise PAYMENT_DISPUTE_STATE_INVALID (409). The merchant may instead
        refund the payment in full, which resolves the dispute (RESOLVED_BY_REFUND). The deadline is
        today at the earliest and no later than 2 banking days before the scheme deadline
        (PAYMENT_DISPUTE_DEADLINE_INVALID, 422); a staff screen offers 5 banking days from today.
      parameters: [{ $ref: "#/components/parameters/DisputeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeEvidenceRequest" }
      responses:
        "200":
          description: The dispute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/disputes/{disputeId}/submission:
    post:
      tags: [DisputeAdmin]
      operationId: submitDispute
      summary: Staff record the date the answer went to the scheme or the payer; the dispute becomes SUBMITTED
      description: From REGISTERED or EVIDENCE_REQUESTED, otherwise PAYMENT_DISPUTE_STATE_INVALID (409).
      parameters: [{ $ref: "#/components/parameters/DisputeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeSubmissionRequest" }
      responses:
        "200":
          description: The dispute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/disputes/{disputeId}/result:
    post:
      tags: [DisputeAdmin]
      operationId: recordDisputeResult
      summary: "Staff record the result: WON (the payment is PAID again) or LOST (CHARGED_BACK, with the scheme's costs)"
      description: >-
        From SUBMITTED only, otherwise PAYMENT_DISPUTE_STATE_INVALID (409). The merchant gets
        payment.dispute_won or payment.dispute_lost. A LOST dispute's amount plus costs is what
        Settlements collects from the merchant, by the bank's procedure.
      parameters: [{ $ref: "#/components/parameters/DisputeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeResultRequest" }
      responses:
        "200":
          description: The dispute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/disputes/{disputeId}/close:
    post:
      tags: [DisputeAdmin]
      operationId: closeDispute
      summary: Staff close a dispute that is WON, LOST or RESOLVED_BY_REFUND
      description: From those three only, otherwise PAYMENT_DISPUTE_STATE_INVALID (409).
      parameters: [{ $ref: "#/components/parameters/DisputeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeNoteRequest" }
      responses:
        "200":
          description: The dispute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/disputes/{disputeId}/evidence/{evidenceId}:
    get:
      tags: [DisputeAdmin]
      operationId: downloadDisputeEvidence
      summary: One file the merchant uploaded
      parameters:
        - { $ref: "#/components/parameters/DisputeId" }
        - { $ref: "#/components/parameters/EvidenceId" }
      responses:
        "200":
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/dispute-register.csv:
    get:
      tags: [DisputeAdmin]
      operationId: downloadDisputeRegister
      summary: The monthly dispute register, one row per merchant
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }, description: "YYYY-MM: disputes received that month" }
      responses:
        "200":
          description: "UTF-8 CSV, one row per merchant: partner id, registered, won, lost, resolved by refund, open, disputed amount, lost amount, costs (amounts in tiyin)"
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/payments/{paymentId}/disputes:
    get:
      tags: [DisputeCabinet]
      operationId: listCabinetPaymentDisputes
      summary: The disputes of one of the merchant's payments, newest first
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      responses:
        "200":
          description: The disputes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DisputeResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/disputes/{disputeId}/evidence:
    post:
      tags: [DisputeCabinet]
      operationId: uploadDisputeEvidence
      summary: The merchant uploads one evidence file while evidence is requested
      description: >-
        PDF, JPEG or PNG, read from the file's own bytes, at most 10 MB, at most 10 files per
        dispute (PAYMENT_EVIDENCE_FILE_INVALID, 422). Only while the dispute is EVIDENCE_REQUESTED
        (PAYMENT_DISPUTE_STATE_INVALID, 409).
      parameters: [{ $ref: "#/components/parameters/DisputeId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeEvidenceResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/partner/disputes/{disputeId}/evidence/{evidenceId}:
    get:
      tags: [DisputeCabinet]
      operationId: downloadCabinetDisputeEvidence
      summary: One file the merchant uploaded to its dispute
      parameters:
        - { $ref: "#/components/parameters/DisputeId" }
        - { $ref: "#/components/parameters/EvidenceId" }
      responses:
        "200":
          description: The file
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/payments/{paymentId}/refund-requests:
    post:
      tags: [PaymentAdmin]
      operationId: requestStaffRefund
      summary: "Staff ask to refund a PAID or DISPUTED payment above the cap or after the window, on the merchant's application; a second admin approves"
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffRefundRequestCreate" }
      responses:
        "201":
          description: The request, waiting for a second admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffRefundRequestResponse" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/refund-requests:
    get:
      tags: [PaymentAdmin]
      operationId: listStaffRefundRequests
      summary: Staff refunds waiting for a second admin, oldest first
      responses:
        "200":
          description: The pending requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffRefundRequestResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/refund-requests/{requestId}/approve:
    post:
      tags: [PaymentAdmin]
      operationId: approveStaffRefund
      summary: "A second admin approves: the money goes back once, without the cap and window, and the decision is audited"
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: The request after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffRefundRequestResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "410": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/refund-requests/{requestId}/reject:
    post:
      tags: [PaymentAdmin]
      operationId: rejectStaffRefund
      summary: A second admin rejects; nothing moves
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200":
          description: The request after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffRefundRequestResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "410": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/calendar/holidays:
    get:
      tags: [BankingCalendar]
      operationId: listHolidays
      summary: The bank's non-working days in a year; weekends are never working days
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        "200":
          description: The holidays, in date order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Holiday" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
    post:
      tags: [BankingCalendar]
      operationId: addHoliday
      summary: Adds a non-working day; refund windows and deadlines counted in working days skip it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Holiday" }
      responses:
        "201":
          description: The holiday
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Holiday" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/calendar/holidays/{date}:
    delete:
      tags: [BankingCalendar]
      operationId: deleteHoliday
      summary: Makes a day a working day again (unless it is a weekend)
      parameters: [{ name: date, in: path, required: true, schema: { type: string, format: date } }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token from realm ecom
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageToken:
      name: token
      in: path
      required: true
      description: The one-time token from the payment page link
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DisputeId:
      name: disputeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      description: The event's id, sent as webhook-id
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: The merchant's own key for this request, e.g. the order number plus an attempt
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      description: 'RFC 9421: what the signature covers, with created, nonce, keyid and alg="hmac-sha256"'
      schema: { type: string }
    Signature:
      name: Signature
      in: header
      required: true
      description: "RFC 9421: the base64 HMAC-SHA256 of the signature base, e.g. sig1=:…:"
      schema: { type: string }
    ContentDigest:
      name: Content-Digest
      in: header
      required: false
      description: "RFC 9530: the body's SHA-256, sha-256=:<base64>:; required when there is a body"
      schema: { type: string }
  schemas:
    CreatePaymentRequest:
      type: object
      required: [salesPointId, orderId, amount, returnUrl]
      properties:
        salesPointId: { type: string, format: uuid }
        orderId: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$", description: "The merchant's order number; one payment per order and website" }
        amount: { type: integer, format: int64, minimum: 100, maximum: 100000000000, description: In tiyin (1 so'm = 100 tiyin) }
        description: { type: string, maxLength: 255 }
        returnUrl: { type: string, maxLength: 2048, pattern: "^https://.+", description: "Where the buyer goes afterwards; one of the website's return addresses" }
    PaymentStatus:
      type: string
      description: >-
        CREATED: link sent · AWAITING_CODE: a code went to the cardholder · CARD_CONFIRMED: ready to
        debit · DEBITING: the scheme is being asked · PAID: the money moved · DECLINED: the scheme
        refused (declineCode says why) · UNKNOWN: the scheme didn't answer, so the money may have
        moved; never treat it as declined; the bank keeps asking the scheme for its status, and the
        order stays locked · MANUAL_REVIEW: still no answer after the configured status checks, a
        person at the bank decides; not final, so no webhook · FAILED: the page closed before any debit ·
        EXPIRED: nobody paid before the page expired · RETURNING: the money is being given back ·
        REVERSED: given back before settlement · REFUNDED: given back after it. Frozen: new lifecycle
        values (disputes, partial refunds) appear only in `state`, which merchants read.
      enum: [CREATED, AWAITING_CODE, CARD_CONFIRMED, DEBITING, PAID, DECLINED, UNKNOWN, MANUAL_REVIEW, FAILED, EXPIRED, RETURNING, REVERSED, REFUNDED]
    PaymentState:
      type: string
      description: >-
        What a merchant sees (FR-CHK-040): the internal steps of the page and the debit
        (AWAITING_CODE, CARD_CONFIRMED, DEBITING) are CONFIRMING, and RETURNING stays PAID until the
        money is back. CREATED: nobody has paid · CONFIRMING: the payer is confirming the card, or the
        debit is running · PAID · DECLINED · FAILED: closed before any debit · UNKNOWN: the scheme
        didn't answer; the bank is checking, never treat it as declined · MANUAL_REVIEW: a person at
        the bank decides · EXPIRED · REVERSED · PARTIALLY_REFUNDED: part given back (reserved: not
        reachable while refunds are full only) · REFUNDED · DISPUTED: the payment is disputed and the
        bank is handling the claim · CHARGED_BACK: the claim was lost and the money went back to the
        payer
      enum: [CREATED, CONFIRMING, PAID, DECLINED, FAILED, UNKNOWN, MANUAL_REVIEW, EXPIRED, REVERSED, PARTIALLY_REFUNDED, REFUNDED, DISPUTED, CHARGED_BACK]
    PaymentSource:
      type: string
      description: "API: created by the merchant's server · LINK: a payment link from the merchant's portal"
      enum: [API, LINK]
    PaymentLinkRequest:
      type: object
      required: [salesPointId, amount, description, validForHours]
      properties:
        salesPointId: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 100, maximum: 100000000000, description: In tiyin (1 so'm = 100 tiyin) }
        description: { type: string, minLength: 1, maxLength: 255, description: What the buyer pays for }
        validForHours: { type: integer, minimum: 1, description: "How long the link works; at most the bank's configured limit" }
    PaymentLinkResponse:
      type: object
      required: [id, salesPointId, orderId, amount, description, status, expiresAt, createdAt, state]
      properties:
        id: { type: string, format: uuid, description: The payment behind the link }
        salesPointId: { type: string, format: uuid }
        orderId: { type: string }
        amount: { type: integer, format: int64 }
        description: { type: string }
        state: { $ref: "#/components/schemas/PaymentState" }
        status: { $ref: "#/components/schemas/PaymentStatus", deprecated: true, description: "Use state: status keeps the internal steps and gains no new values; it is removed in the next major release" }
        url: { type: string, description: "Only in the response that created the link: send it to the buyer" }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PaymentCardRequest:
      type: object
      required: [number, expiry]
      properties:
        number: { type: string, pattern: "^[0-9]{16}$" }
        expiry: { type: string, pattern: "^[0-9]{4}$", description: YYMM }
    PaymentCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{4,8}$" }
    PaymentPage:
      type: object
      required: [status, amount, orderId, merchantName, hasLogo, schemes, expiresAt, cardAttemptsLeft, codeAttemptsLeft]
      properties:
        status: { $ref: "#/components/schemas/PaymentStatus" }
        amount: { type: integer, format: int64, description: In tiyin }
        orderId: { type: string }
        description: { type: string }
        merchantName: { type: string, description: The website's name }
        hasLogo: { type: boolean }
        schemes: { type: array, items: { type: string, enum: [UZCARD, HUMO] }, description: Cards this website accepts }
        expiresAt: { type: string, format: date-time }
        cardAttemptsLeft: { type: integer }
        codeAttemptsLeft: { type: integer, description: For the card in use }
        maskedCard: { type: string, description: "Set once a card is in use, e.g. 860014******7890" }
        cardScheme: { type: string, enum: [UZCARD, HUMO] }
        cardBank: { type: string, description: "The bank that issued the card, in the buyer's language, when known" }
        rrn: { type: string, description: The scheme's reference number for a paid payment }
        declineCode: { type: string, description: "Why the scheme declined, e.g. CARD_INSUFFICIENT_FUNDS" }
        paidAt: { type: string, format: date-time }
        returnUrl: { type: string, description: "Back to the shop; none for a payment link" }
        resultWindowSeconds: { type: integer, minimum: 0, description: "How long the page keeps asking for the result of an UNKNOWN payment before it tells the buyer not to pay again" }
    PaymentResponse:
      type: object
      required: [id, salesPointId, orderId, amount, status, createdAt, state]
      properties:
        id: { type: string, format: uuid }
        salesPointId: { type: string, format: uuid }
        orderId: { type: string }
        amount: { type: integer, format: int64 }
        description: { type: string }
        state: { $ref: "#/components/schemas/PaymentState" }
        status: { $ref: "#/components/schemas/PaymentStatus", deprecated: true, description: "Use state: status keeps the internal steps and gains no new values; it is removed in the next major release" }
        paymentUrl: { type: string, description: "Only in the response that created the payment: send the buyer here" }
        pageExpiresAt: { type: string, format: date-time }
        rrn: { type: string, description: "The scheme's reference number, once paid" }
        declineCode: { type: string, description: Why the scheme declined }
        fee: { type: integer, format: int64, description: "The bank's fee in tiyin, fixed when the debit started" }
        net: { type: integer, format: int64, description: "What the merchant receives, in tiyin" }
        paidAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time, description: When the money went back to the card }
        createdAt: { type: string, format: date-time }
        operations:
          type: array
          description: "Every call to the scheme for this payment, oldest first: the debit, then any reversal or refund"
          items: { $ref: "#/components/schemas/PaymentOperationResponse" }
        refundableUntil: { type: string, format: date-time, description: "Until when the merchant can still refund it; only while it is PAID" }
        refundDaysLeft: { type: integer, description: "Days left to refund it: working days, or calendar days under an approved extension; only while it is PAID" }
    DailyReport:
      type: object
      description: >-
        One website's business day, in the settlement time zone. Paid counts payments paid that day
        and not reversed; refunded counts refunds made that day, whenever the payment was. A refund
        gives the fee back by the rule frozen on the payment, so the payout is the net of what was
        paid less the net of what was refunded.
      required: [businessDay, salesPointId, paidCount, paidAmount, fee, net, refundedCount, refundedAmount, refundedFee, payout]
      properties:
        businessDay: { type: string, format: date }
        salesPointId: { type: string, format: uuid }
        paidCount: { type: integer }
        paidAmount: { type: integer, format: int64, description: In tiyin }
        fee: { type: integer, format: int64 }
        net: { type: integer, format: int64 }
        refundedCount: { type: integer }
        refundedAmount: { type: integer, format: int64 }
        refundedFee: { type: integer, format: int64, description: "The fee given back on the day's refunds, in tiyin" }
        payout: { type: integer, format: int64, description: "net − (refundedAmount − refundedFee); negative when refunds outweigh the day" }
    PaymentResolutionRequest:
      type: object
      required: [decision, note]
      properties:
        decision: { type: string, enum: [NOT_DEBITED, DEBITED, NOT_RETURNED, RETURNED], description: "What the scheme told the person: about the debit (MANUAL_REVIEW) or the return (RETURNING)" }
        note: { type: string, minLength: 1, maxLength: 500, pattern: ".*\\S.*", description: "Who at the scheme confirmed it, and how" }
        schemeReference: { type: string, maxLength: 64, description: "The scheme's id for the debit; needed for DEBITED" }
    PaymentAdminResponse:
      type: object
      required: [id, partnerId, salesPointId, source, orderId, amount, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        salesPointId: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/PaymentSource" }
        clientId: { type: string, description: "The API client that created it; none for a payment link" }
        orderId: { type: string }
        amount: { type: integer, format: int64 }
        description: { type: string }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        state: { $ref: "#/components/schemas/PaymentState", description: "What the merchant sees; DISPUTED and CHARGED_BACK show only here, as status is frozen" }
        cardMask: { type: string }
        cardScheme: { type: string }
        merchantId: { type: string, description: The e-POS terminal's MID the debit went through }
        terminalId: { type: string, description: The e-POS terminal's TID }
        fee: { type: integer, format: int64 }
        net: { type: integer, format: int64 }
        rrn: { type: string }
        declineCode: { type: string }
        paidAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200, pattern: ".*\\S.*", description: Why the money goes back }
    OperationState:
      type: string
      description: "REQUESTED: written before the call to the scheme · APPROVED · DECLINED · UNKNOWN: the scheme didn't answer; the bank asks it for the status, never sends the call again"
      enum: [REQUESTED, APPROVED, DECLINED, UNKNOWN]
    PaymentOperationResponse:
      type: object
      required: [kind, state, amount, startedAt]
      properties:
        kind: { type: string, enum: [DEBIT, REVERSAL, REFUND] }
        state: { $ref: "#/components/schemas/OperationState" }
        amount: { type: integer, format: int64, description: In tiyin }
        reason: { type: string, description: "For a reversal or refund: why" }
        declineCode: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    StaffRefundRequestCreate:
      type: object
      required: [applicationRef, reason, note]
      properties:
        applicationRef: { type: string, minLength: 1, maxLength: 100, description: "The merchant's written application, as the bank registered it" }
        reason: { type: string, minLength: 1, maxLength: 200, pattern: ".*\\S.*", description: Why the money goes back }
        note: { type: string, minLength: 1, maxLength: 500, pattern: ".*\\S.*", description: "Why staff refund it: above the cap, or after the window" }
    StaffRefundRequestResponse:
      type: object
      required: [id, paymentId, applicationRef, reason, note, status, requestedBy, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: In tiyin }
        applicationRef: { type: string }
        reason: { type: string }
        note: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED] }
        requestedBy: { type: string }
        decidedBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Holiday:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 100 }

    # ------- Webhooks (FR-CHK-060…062) -------
    WebhookEvent:
      type: object
      description: >-
        The JSON body POSTed to the website's webhook URL (see the description at the top for the
        signature). Types: payment.paid, payment.declined, payment.failed, payment.expired,
        payment.reversed, payment.refunded and payment.refund_failed (the payment stays PAID); for
        a dispute payment.disputed, payment.dispute_won and payment.dispute_lost, with dispute set.
        Amounts are in tiyin and come from the payment: the fee is the bank's, fixed when the debit
        started, and net = gross − fee. Refunds are of the whole payment, so a refund gives back
        gross and the bank's fee with it. No card number beyond the masked one, and nothing about
        the payer. Every field is present, null when it has no value. New fields and types may
        appear; ignore what you don't know.
      required: [eventId, type, paymentId, salesPointId, orderId, state, gross, fee, net, paymentSource, maskedPan, cardScheme, rrn, receiptUrl, reason, dispute, occurredAt]
      example:
        eventId: 0192f0a4-5b6c-7d8e-9f00-112233445566
        type: payment.paid
        paymentId: 0192f0a4-1111-7d8e-9f00-112233445566
        salesPointId: 0192f0a4-2222-7d8e-9f00-112233445566
        orderId: A-1042
        state: PAID
        gross: 45000000
        fee: 900000
        net: 44100000
        paymentSource: NEW_CARD
        maskedPan: 860014******7890
        cardScheme: UZCARD
        rrn: "123456789012"
        receiptUrl: null
        reason: null
        dispute: null
        occurredAt: "2026-10-25T09:00:00Z"
      properties:
        eventId: { type: string, format: uuid, description: "The same as webhook-id; drop repeats by it" }
        type: { type: string, example: payment.paid }
        paymentId: { type: string, format: uuid }
        salesPointId: { type: string, format: uuid }
        orderId: { type: string }
        state: { $ref: "#/components/schemas/PaymentState" }
        gross: { type: integer, format: int64, description: "What the buyer paid, in tiyin" }
        fee: { type: integer, format: int64, nullable: true, description: "The bank's fee in tiyin; null when the payment was never paid (declined, failed, expired, or given back after its page closed)" }
        net: { type: integer, format: int64, nullable: true, description: "gross − fee: what the merchant receives for a paid payment, in tiyin; null when fee is" }
        paymentSource: { $ref: "#/components/schemas/WebhookPaymentSource" }
        maskedPan: { type: string, nullable: true, description: "The card, e.g. 860014******7890; null before a card was given" }
        cardScheme: { type: string, nullable: true, description: "UZCARD or HUMO (more may appear); null before a card was given" }
        rrn: { type: string, nullable: true, description: "The scheme's reference number, once paid" }
        receiptUrl: { type: string, nullable: true, description: "The fiscal receipt; always null until the bank issues receipts" }
        reason: { type: string, nullable: true, description: "Why it was declined (e.g. CARD_INSUFFICIENT_FUNDS), failed, given back after its page closed (TIMEOUT_REVERSAL) or why a refund failed" }
        dispute:
          description: "The dispute, on the dispute events; null on the others"
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WebhookDispute" }]
        occurredAt: { type: string, format: date-time }
    WebhookPaymentSource:
      type: string
      description: "NEW_CARD: the buyer typed the card on the page · SAVED_CARD and INTERBANK: reserved, not sent yet"
      enum: [NEW_CARD, SAVED_CARD, INTERBANK]
    WebhookDeliveryResponse:
      type: object
      description: >-
        One event and its delivery. A failed attempt (no 2xx within the timeout) is tried again,
        waiting longer each time, for 24 hours; a later event of the same payment waits until the
        earlier one is delivered or given up. Then the event is undelivered: the bank's operations
        are alerted, and the merchant can replay it.
      required: [eventId, type, occurredAt, undelivered, attempts]
      properties:
        eventId: { type: string, format: uuid }
        type: { type: string, example: payment.paid }
        occurredAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, description: "The first 2xx; absent until then" }
        nextAttemptAt: { type: string, format: date-time, description: "When it is tried next; absent when nothing is due" }
        undelivered: { type: boolean, description: "Given up after 24 hours of failed attempts; a replay clears it" }
        attempts:
          type: array
          description: Oldest first
          items: { $ref: "#/components/schemas/WebhookAttempt" }
    WebhookAttempt:
      type: object
      required: [attempt, attemptedAt]
      properties:
        attempt: { type: integer, minimum: 1 }
        url: { type: string, description: "The address it went to; absent when the website had none then" }
        httpStatus: { type: integer, description: "The website's answer; absent when none came" }
        error: { type: string, description: "Why no answer came, e.g. a timeout or a refused address" }
        attemptedAt: { type: string, format: date-time }

    # ------- Disputes (FR-CHK-090…095) -------
    DisputeState:
      type: string
      description: >-
        REGISTERED: staff recorded the complaint or claim · EVIDENCE_REQUESTED: the merchant is asked
        for evidence by a deadline, or may refund instead · RESOLVED_BY_REFUND: the merchant gave the
        whole payment back · SUBMITTED: the answer went to the scheme or the payer · WON: the payment
        is PAID again · LOST: the payment is CHARGED_BACK · CLOSED: nothing more to do
      enum: [REGISTERED, EVIDENCE_REQUESTED, RESOLVED_BY_REFUND, SUBMITTED, WON, LOST, CLOSED]
    DisputeSource:
      type: string
      description: "DIRECT: a complaint received at the bank (the usual path) · SCHEME: a claim from the payer's bank through Uzcard or Humo"
      enum: [DIRECT, SCHEME]
    DisputeRegisterRequest:
      type: object
      required: [source, amount, reason, receivedOn, schemeDeadline]
      properties:
        source: { $ref: "#/components/schemas/DisputeSource" }
        claimRef: { type: string, maxLength: 64, description: "The scheme's claim reference; required for SCHEME" }
        amount: { type: integer, format: int64, minimum: 1, description: "Disputed, in tiyin; at most the payment's amount" }
        reason: { type: string, minLength: 1, maxLength: 500, pattern: ".*\\S.*", description: What the payer says }
        receivedOn: { type: string, format: date }
        schemeDeadline: { type: string, format: date, description: "When the answer is due, to the scheme or to the payer" }
    DisputeEvidenceRequest:
      type: object
      required: [deadline, note]
      properties:
        deadline: { type: string, format: date, description: "The last day the merchant may upload; at most 2 banking days before the scheme deadline" }
        note: { type: string, minLength: 1, maxLength: 500, pattern: ".*\\S.*", description: "What evidence, shown to the merchant" }
    DisputeSubmissionRequest:
      type: object
      required: [sentOn, note]
      properties:
        sentOn: { type: string, format: date }
        note: { type: string, minLength: 1, maxLength: 500, pattern: ".*\\S.*" }
    DisputeResultRequest:
      type: object
      required: [result, note]
      properties:
        result: { type: string, enum: [WON, LOST] }
        costs: { type: integer, format: int64, minimum: 0, description: "The scheme's costs in tiyin, for LOST; 0 when absent" }
        note: { type: string, minLength: 1, maxLength: 500, pattern: ".*\\S.*" }
    DisputeNoteRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 500, pattern: ".*\\S.*" }
    DisputeResponse:
      type: object
      required: [id, paymentId, partnerId, salesPointId, source, amount, reason, receivedOn, schemeDeadline, state, dueSoon, evidence, createdAt]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        salesPointId: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/DisputeSource" }
        scheme: { type: string, description: "UZCARD or HUMO: the payment's card" }
        claimRef: { type: string }
        amount: { type: integer, format: int64, description: In tiyin }
        costs: { type: integer, format: int64, description: "The scheme's costs in tiyin, once LOST" }
        reason: { type: string }
        receivedOn: { type: string, format: date }
        schemeDeadline: { type: string, format: date }
        evidenceDeadline: { type: string, format: date, description: Once evidence is requested }
        evidenceNote: { type: string, description: "What evidence staff asked for" }
        state: { $ref: "#/components/schemas/DisputeState" }
        outcome: { type: string, enum: [WON, LOST, RESOLVED_BY_REFUND], description: "How it ended; kept once CLOSED" }
        dueSoon: { type: boolean, description: "An open deadline (evidence, or the scheme's) is within 2 banking days" }
        sentOn: { type: string, format: date }
        resultAt: { type: string, format: date-time }
        evidence:
          type: array
          description: Oldest first
          items: { $ref: "#/components/schemas/DisputeEvidenceResponse" }
        createdAt: { type: string, format: date-time }
    DisputeEvidenceResponse:
      type: object
      required: [id, fileName, contentType, size, uploadedBy, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        size: { type: integer, format: int64, description: In bytes }
        uploadedBy: { type: string, description: "The merchant user's e-mail (shown to the merchant's own users and to staff)" }
        uploadedAt: { type: string, format: date-time }
    WebhookDispute:
      type: object
      description: The dispute behind a payment.disputed, payment.dispute_won or payment.dispute_lost event
      required: [id, amount, costs, schemeDeadline, evidenceDeadline]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer, format: int64, description: "Disputed, in tiyin" }
        costs: { type: integer, format: int64, nullable: true, description: "The scheme's costs in tiyin, on dispute_lost; null before" }
        schemeDeadline: { type: string, format: date }
        evidenceDeadline: { type: string, format: date, nullable: true, description: "Once evidence is requested" }
