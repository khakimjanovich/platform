# Reconciliation API: our card operations of a business day against the Uzcard and Humo reports, for the bank's staff.
openapi: 3.0.3
info:
  title: Reconciliation API
  version: "1"
  description: |
    Every business day (00:00:00 to 23:59:59 in Tashkent) each scheme is reconciled once at 07:00 the
    next morning, and again whenever staff start a run. A run compares every debit, reversal and refund
    the bank sent with the scheme's report and puts each in exactly one match state: MATCHED,
    MISMATCHED, MISSING_AT_SCHEME or MISSING_AT_BANK. Every item not matched, and every check that
    fails (the day's totals, the fee Humo charged), is an exception with one owner, worked from the
    queue. Amounts are in tiyin. No money moves from reconciliation.
security:
  - bearer: []

paths:
  /api/v1/admin/reconciliation/runs:
    post:
      tags: [ReconciliationAdmin]
      operationId: startReconciliationRun
      summary: Reconciles one scheme's business day now; a run already going for it is returned instead
      description: >-
        Only a day that has ended in Tashkent: today or a later day is 409
        RECONCILIATION_DAY_NOT_ENDED. A re-run of a day reconciled before never classes an item
        twice: items still matched stay matched, exceptions whose items now match are resolved, and
        no exception is opened twice. An exception already RESOLVED_MATCHED or WRITTEN_OFF is never
        reopened, whatever the re-run finds. A re-run of a day already closed (10:00 the next
        morning) is closed as soon as it finishes, with the same rule: a payment still UNKNOWN is
        UNKNOWN_AT_CLOSE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: The run, started or already going
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRun" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
    get:
      tags: [ReconciliationAdmin]
      operationId: listReconciliationRuns
      summary: Runs, newest first, by scheme and day
      parameters:
        - { name: scheme, in: query, schema: { $ref: "#/components/schemas/Scheme" } }
        - { name: day, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Up to 100 runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReconciliationRun" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/runs/{runId}:
    get:
      tags: [ReconciliationAdmin]
      operationId: getReconciliationRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRun" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/runs/{runId}/items:
    get:
      tags: [ReconciliationAdmin]
      operationId: listMatchItems
      summary: The items of a run's day, by match state
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/MatchState" } }
        - { name: reason, in: query, schema: { $ref: "#/components/schemas/ReasonCode" } }
        - { $ref: "#/components/parameters/Page" }
      responses:
        "200":
          description: Up to 100 items; fewer means the last page
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchItem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/reports/{scheme}/{day}:
    get:
      tags: [ReconciliationAdmin]
      operationId: downloadBreakReport
      summary: "The break report of a scheme's day as CSV, also when there are no breaks"
      parameters:
        - { name: scheme, in: path, required: true, schema: { $ref: "#/components/schemas/Scheme" } }
        - { name: day, in: path, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: "UTF-8 CSV: the latest run and its counts per match state, the totals check, the fee check per terminal (Humo), exceptions by reason and state, then one row per exception of the day and every exception still open from earlier days (reason, state, owner, amount, age, SLA due, overdue)"
          content:
            text/csv:
              schema: { type: string, format: binary }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions:
    get:
      tags: [ReconciliationAdmin]
      operationId: listReconciliationExceptions
      summary: The exceptions queue, oldest first
      parameters:
        - { name: scheme, in: query, schema: { $ref: "#/components/schemas/Scheme" } }
        - { name: day, in: query, schema: { type: string, format: date } }
        - { name: reason, in: query, schema: { $ref: "#/components/schemas/ReasonCode" } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ExceptionState" } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
      responses:
        "200":
          description: Up to 100 exceptions; fewer means the last page
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReconciliationExceptionResponse" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions/{exceptionId}:
    get:
      tags: [ReconciliationAdmin]
      operationId: getReconciliationException
      summary: One exception with its audit trail
      parameters: [{ $ref: "#/components/parameters/ExceptionId" }]
      responses:
        "200": { $ref: "#/components/responses/ExceptionDetail" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions/{exceptionId}/take:
    post:
      tags: [ReconciliationAdmin]
      operationId: takeReconciliationException
      summary: The caller becomes the owner of an OPEN exception, which goes IN_PROGRESS
      parameters: [{ $ref: "#/components/parameters/ExceptionId" }]
      responses:
        "200": { $ref: "#/components/responses/ExceptionDetail" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions/{exceptionId}/reassign:
    post:
      tags: [ReconciliationAdmin]
      operationId: reassignReconciliationException
      summary: Gives an exception being worked to another owner; the audit keeps both
      description: >-
        Any admin, while the exception is OPEN, IN_PROGRESS or DISPUTED; not while a write-off waits
        for approval (its new owner could then approve it).
      parameters: [{ $ref: "#/components/parameters/ExceptionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExceptionDetail" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions/{exceptionId}/notes:
    post:
      tags: [ReconciliationAdmin]
      operationId: noteReconciliationException
      summary: Adds a note to an exception
      parameters: [{ $ref: "#/components/parameters/ExceptionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExceptionDetail" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions/{exceptionId}/resolve-matched:
    post:
      tags: [ReconciliationAdmin]
      operationId: resolveReconciliationExceptionMatched
      summary: "The owner marks the exception matched, with evidence (a status inquiry result, a later report item, a scheme letter)"
      description: Only the owner, only while IN_PROGRESS; the item then counts as matched.
      parameters: [{ $ref: "#/components/parameters/ExceptionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveMatchedRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExceptionDetail" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "422": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions/{exceptionId}/write-off:
    post:
      tags: [ReconciliationAdmin]
      operationId: requestReconciliationWriteOff
      summary: "The owner asks to write the exception off (WRITE_OFF_REQUESTED); a second admin approves or rejects it"
      parameters: [{ $ref: "#/components/parameters/ExceptionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteOffRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExceptionDetail" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions/{exceptionId}/write-off/approve:
    post:
      tags: [ReconciliationAdmin]
      operationId: approveReconciliationWriteOff
      summary: "A second admin approves a requested write-off: the exception is WRITTEN_OFF"
      description: The admin who asked for the write-off cannot approve it (403, SAME_ACTOR).
      parameters: [{ $ref: "#/components/parameters/ExceptionId" }]
      responses:
        "200": { $ref: "#/components/responses/ExceptionDetail" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /api/v1/admin/reconciliation/exceptions/{exceptionId}/write-off/reject:
    post:
      tags: [ReconciliationAdmin]
      operationId: rejectReconciliationWriteOff
      summary: "A second admin rejects a requested write-off: the exception goes back IN_PROGRESS to its owner"
      description: The admin who asked for the write-off cannot reject it either (403, SAME_ACTOR).
      parameters: [{ $ref: "#/components/parameters/ExceptionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExceptionDetail" }
        "400": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "401": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "403": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "404": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }
        "409": { $ref: "../../../../common/problem-v1.yaml#/components/responses/Problem" }

  /internal/v1/reconciliation/operations/{operationId}:
    get:
      tags: [ReconciliationInternal]
      operationId: findOperationMatch
      summary: "How reconciliation classed one of our card operations, for the staff payment view; empty means not reconciled yet"
      description: Inside the app only; never routed from outside.
      parameters: [{ name: operationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: The latest class, or an empty list
          content:
            application/json:
              schema:
                type: array
                maxItems: 1
                items: { $ref: "#/components/schemas/OperationMatch" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak access token from realm ecom
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: From 0; 100 per page
      schema: { type: integer, format: int32, minimum: 0 }
  responses:
    ExceptionDetail:
      description: The exception with its audit trail
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReconciliationExceptionDetail" }
  schemas:
    Scheme:
      type: string
      enum: [UZCARD, HUMO]
    RunState:
      type: string
      description: "RUNNING: pulling or matching. DONE: every item classed. FAILED: stopped before classing; nothing of it counts"
      enum: [RUNNING, DONE, FAILED]
    MatchState:
      type: string
      enum: [MATCHED, MISMATCHED, MISSING_AT_SCHEME, MISSING_AT_BANK]
    ReasonCode:
      type: string
      description: >-
        Item reasons: MISMATCHED ← AMOUNT_DIFFERS, DATE_DIFFERS, TERMINAL_DIFFERS, STATE_DIFFERS,
        DUPLICATE_SCHEME_ITEM, DUPLICATE_BANK_ITEM; MISSING_AT_SCHEME ← NO_SCHEME_ITEM,
        UNKNOWN_AT_CLOSE; MISSING_AT_BANK ← NO_BANK_ITEM. Day reason: TOTALS_DIFFER, a difference
        no item explains: Uzcard's control total is not the sum of the items its report listed (a
        page lost or seen twice), or a Humo terminal's totals are not ours once the item breaks are
        counted (debits we never sent). A difference an item break already explains opens no
        TOTALS_DIFFER, so nothing is counted twice. Fee reasons (Humo, the item stays MATCHED): FEE_TAKEN_TWICE
        (Humo charged a fee above 0, though our system already takes the fee) and NO_FEE_DATA (Humo
        sent no fee).
      enum:
        - AMOUNT_DIFFERS
        - DATE_DIFFERS
        - TERMINAL_DIFFERS
        - STATE_DIFFERS
        - DUPLICATE_SCHEME_ITEM
        - DUPLICATE_BANK_ITEM
        - NO_SCHEME_ITEM
        - UNKNOWN_AT_CLOSE
        - NO_BANK_ITEM
        - TOTALS_DIFFER
        - FEE_TAKEN_TWICE
        - NO_FEE_DATA
    ExceptionState:
      type: string
      description: "WRITE_OFF_REQUESTED: the owner asked to write it off; waiting for a second admin. DISPUTED is reserved: nothing sets it yet (disputes come later)."
      enum: [OPEN, IN_PROGRESS, WRITE_OFF_REQUESTED, RESOLVED_MATCHED, WRITTEN_OFF, DISPUTED]
    RunRequest:
      type: object
      required: [scheme, day]
      properties:
        scheme: { $ref: "#/components/schemas/Scheme" }
        day: { type: string, format: date, description: "The business day, in Tashkent" }
    ReconciliationRun:
      type: object
      required: [id, scheme, day, version, state, startedBy, startedAt, matched, mismatched, missingAtScheme, missingAtBank]
      properties:
        id: { type: string, format: uuid }
        scheme: { $ref: "#/components/schemas/Scheme" }
        day: { type: string, format: date }
        version: { type: integer, format: int32, description: "1 for the day's first run, then one more per re-run" }
        state: { $ref: "#/components/schemas/RunState" }
        startedBy: { type: string, description: "SCHEDULE, or the admin who started it" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        pages: { type: integer, format: int32, description: Report pages stored }
        matched: { type: integer, format: int32 }
        mismatched: { type: integer, format: int32 }
        missingAtScheme: { type: integer, format: int32 }
        missingAtBank: { type: integer, format: int32 }
        bankCount: { type: integer, format: int64, description: "Our approved debits of the day" }
        bankSum: { type: integer, format: int64, description: "Our approved debits less reversals and refunds, in tiyin (Humo: less reversals only, as Humo totals them)" }
        schemeCount: { type: integer, format: int64, description: "The scheme's count (Uzcard report.sum; Humo debits over its terminals)" }
        schemeSum: { type: integer, format: int64, description: "The scheme's total, in tiyin (Uzcard report.sum; Humo debits less reversals over its terminals)" }
        totalsAgree: { type: boolean, description: "No TOTALS_DIFFER: every difference between ours and the scheme's figures is explained by an item break" }
        closedAt: { type: string, format: date-time, description: "When the day was closed (10:00 the next day); unset while open" }
        error: { type: string, description: Why a FAILED run stopped }
    MatchItem:
      type: object
      required: [id, state, kind]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/MatchState" }
        reason: { $ref: "#/components/schemas/ReasonCode" }
        kind: { type: string, enum: [DEBIT, REVERSAL, REFUND] }
        operationId: { type: string, format: uuid, description: Our operation; unset for MISSING_AT_BANK }
        paymentId: { type: string, format: uuid }
        merchantId: { type: string }
        terminalId: { type: string }
        rrn: { type: string }
        schemeRef: { type: string }
        maskedPan: { type: string }
        bankAmount: { type: integer, format: int64, description: In tiyin }
        schemeAmount: { type: integer, format: int64, description: In tiyin }
        feeCharged: { type: integer, format: int64, description: "Humo: the fee Humo charged, in tiyin; expected 0" }
        exceptionId: { type: string, format: uuid, description: "The item's open or latest exception, if it has one" }
        bankTime: { type: string, format: date-time }
        schemeTime: { type: string, format: date-time }
    ReconciliationExceptionResponse:
      type: object
      required: [id, scheme, day, reason, state, owner, amount, openedAt, slaDueAt, overdue]
      properties:
        id: { type: string, format: uuid }
        scheme: { $ref: "#/components/schemas/Scheme" }
        day: { type: string, format: date }
        reason: { $ref: "#/components/schemas/ReasonCode" }
        state: { $ref: "#/components/schemas/ExceptionState" }
        owner: { type: string, description: "The queue (OPERATIONS, FINANCE) until someone takes it, then that admin" }
        amount: { type: integer, format: int64, description: "In tiyin, what is at stake: the item's amount (ours, else the scheme's), the fee Humo charged, or the totals difference" }
        runId: { type: string, format: uuid, description: The run that opened it }
        itemId: { type: string, format: uuid, description: "The item; unset for TOTALS_DIFFER" }
        operationId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        merchantId: { type: string }
        terminalId: { type: string }
        rrn: { type: string }
        schemeRef: { type: string }
        maskedPan: { type: string }
        bankAmount: { type: integer, format: int64, description: "In tiyin: our amount, or our matched total for TOTALS_DIFFER" }
        schemeAmount: { type: integer, format: int64, description: "In tiyin: the scheme's amount (Humo tran_Amount), or its total for TOTALS_DIFFER" }
        feeCharged: { type: integer, format: int64, description: "FEE_TAKEN_TWICE: the fee Humo charged, in tiyin" }
        openedAt: { type: string, format: date-time }
        slaDueAt: { type: string, format: date-time, description: "Above 10 000 000 UZS 4 hours after opening, otherwise the end of the next banking day" }
        overdue: { type: boolean }
        resolvedAt: { type: string, format: date-time }
        writeOffRequestedBy: { type: string }
    ReconciliationExceptionDetail:
      type: object
      required: [exception, audit]
      properties:
        exception: { $ref: "#/components/schemas/ReconciliationExceptionResponse" }
        evidenceType: { $ref: "#/components/schemas/EvidenceType" }
        evidenceReference: { type: string }
        writeOffReason: { type: string }
        audit:
          type: array
          items: { $ref: "#/components/schemas/ExceptionAuditEntry" }
    ExceptionAuditEntry:
      type: object
      required: [action, actor, occurredAt]
      properties:
        action: { type: string, enum: [OPENED, TAKEN, REASSIGNED, NOTED, RESOLVED_MATCHED, AUTO_MATCHED, WRITE_OFF_REQUESTED, WRITE_OFF_REJECTED, WRITTEN_OFF] }
        actor: { type: string, description: "SYSTEM, or the admin" }
        fromState: { $ref: "#/components/schemas/ExceptionState" }
        toState: { $ref: "#/components/schemas/ExceptionState" }
        fromOwner: { type: string }
        toOwner: { type: string }
        note: { type: string }
        occurredAt: { type: string, format: date-time }
    EvidenceType:
      type: string
      description: "STATUS_INQUIRY: the scheme's status answer; LATER_REPORT: a later report item; SCHEME_LETTER: a letter from the scheme"
      enum: [STATUS_INQUIRY, LATER_REPORT, SCHEME_LETTER]
    ReassignRequest:
      type: object
      required: [owner]
      properties:
        owner: { type: string, minLength: 1, maxLength: 100 }
    NoteRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
    ResolveMatchedRequest:
      type: object
      required: [evidenceType, evidenceReference]
      properties:
        evidenceType: { $ref: "#/components/schemas/EvidenceType" }
        evidenceReference: { type: string, minLength: 1, maxLength: 500, description: "The status answer, report item or letter reference" }
        note: { type: string, maxLength: 2000 }
    WriteOffRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    OperationMatch:
      type: object
      required: [operationId, state, runId, scheme, day, classedAt]
      properties:
        operationId: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/MatchState" }
        reason: { $ref: "#/components/schemas/ReasonCode" }
        runId: { type: string, format: uuid }
        scheme: { $ref: "#/components/schemas/Scheme" }
        day: { type: string, format: date }
        classedAt: { type: string, format: date-time }
