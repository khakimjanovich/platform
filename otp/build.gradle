// One-time codes for any module: stored as a keyed hash in Redis, with a lifetime, an attempt limit and a send limit.
plugins {
    id 'ecom.library'
    id 'ecom.integration-test'
}

dependencies {
    api platform(libs.spring.boot.bom)
    runtimeOnly project(':config') // loads the files in META-INF/spring/…LibraryDefaults.imports
    api project(":error")
    api libs.starter.data.redis
    implementation libs.spring.boot.autoconfigure
    implementation libs.micrometer.core // issued, verified and rejected counters
    implementation libs.starter.validation // the properties are checked at startup

    integrationTestImplementation libs.testcontainers.core
    integrationTestImplementation libs.testcontainers.junit
    integrationTestImplementation libs.spring.boot.testcontainers
}
