// One-time codes for any module: stored as a keyed hash in Valkey, with a lifetime, an attempt limit and a send limit.
plugins {
    id 'platform.library'
    id 'platform.integration-test'
}

dependencies {
    api platform(libs.spring.boot.bom)
    runtimeOnly libs.platform.config // loads the files in META-INF/spring/…LibraryDefaults.imports
    api project(":error")
    api project(':valkey')
    implementation libs.spring.boot.autoconfigure
    implementation libs.micrometer.core // issued, verified and rejected counters
    implementation libs.starter.validation // the properties are checked at startup

    testImplementation testFixtures(project(':error'))

    integrationTestImplementation libs.starter.data.redis
    integrationTestImplementation libs.testcontainers.core
    integrationTestImplementation libs.testcontainers.junit
    integrationTestImplementation libs.spring.boot.testcontainers
}
