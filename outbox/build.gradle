// A transactional outbox for any module: events written in the module's own transaction, to a table in
// its own schema, and a relay that publishes them to Kafka at least once, in the order written.
plugins {
    id 'platform.library'
    id 'platform.integration-test'
}

dependencies {
    api platform(libs.spring.boot.bom)
    api libs.starter.kafka
    api libs.spring.jdbc
    api libs.micrometer.tracing // the relay sends each event inside the trace that wrote it

    integrationTestImplementation project(':persistence') // the module's own beans, as a module builds them
    integrationTestImplementation libs.liquibase.core
    integrationTestImplementation libs.testcontainers.postgresql
    integrationTestImplementation libs.testcontainers.kafka
    integrationTestImplementation libs.testcontainers.junit
    integrationTestRuntimeOnly libs.postgresql
}
