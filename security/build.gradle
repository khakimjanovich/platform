// One way to secure every app: Keycloak access tokens, realm roles, route rules from configuration,
// 401/403 answered by the app's handlers.
plugins {
    id 'platform.library'
    id 'platform.integration-test'
}

dependencies {
    api platform(libs.spring.boot.bom)
    api libs.starter.oauth2.resource.server
    implementation libs.spring.boot.autoconfigure
    compileOnly libs.spring.security.oauth2.client // service tokens, only in an app with OAuth2 clients
    compileOnly libs.spring.boot.http.client // the token requests' timeouts, over Boot's client
    compileOnly libs.jakarta.servlet // provided by the app's web server

    testImplementation libs.starter.webmvc
    testImplementation project(':error') // the app's 401/403 handlers in tests
    testImplementation libs.spring.security.test
    testImplementation libs.starter.oauth2.client
    testImplementation libs.spring.boot.http.client

    integrationTestImplementation libs.starter.actuator
    integrationTestImplementation libs.starter.restclient
    integrationTestImplementation libs.wiremock
    integrationTestImplementation testFixtures(project(':keycloak')) // demo-realm.json
    integrationTestImplementation libs.testcontainers.core
    integrationTestImplementation libs.testcontainers.junit
}
