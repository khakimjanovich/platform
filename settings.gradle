// The platform: every library in one build. The app and the adapters include it
// (includeBuild), and Gradle puts these projects in place of uz.khakimjanovich.platform:* dependencies.
pluginManagement { includeBuild 'build-logic' }

rootProject.name = 'platform'

include('versioning')
include('config', 'masking', 'error', 'otp', 'security', 'keycloak', 'persistence', 'vault', 'valkey', 'file-store', 'observability')

// The version catalog is gradle/libs.versions.toml, Gradle's default (read as `libs`), where
// Dependabot finds it too.
dependencyResolutionManagement {
    repositories { mavenCentral() }
}
