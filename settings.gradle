// The platform: every library in one build, published as uz.khakimjanovich.platform:*. The services
// and adapters take it through platform.settings (README.md §Building on the platform).
pluginManagement { includeBuild 'build-logic' }

rootProject.name = 'platform'

include('versioning')
include('config', 'masking', 'breaker', 'error', 'otp', 'security', 'keycloak', 'persistence', 'vault', 'valkey', 'file-store', 'observability',
        'outbox', 'idempotency')

// The version catalog is gradle/libs.versions.toml, Gradle's default (read as `libs`), where
// Dependabot finds it too.
dependencyResolutionManagement {
    repositories { mavenCentral() }
}
