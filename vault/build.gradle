// Secrets from HashiCorp Vault (KV version 2) for any module, through Spring Vault: read only,
// failing closed, with Vault's own authentication methods (token, AppRole, Kubernetes) and token
// renewal from Spring Cloud Vault, and a short cache for merchants' signing keys.
plugins {
    id 'ecom.library'
    id 'ecom.integration-test'
}

dependencies {
    api platform(libs.spring.boot.bom)
    api platform(libs.spring.cloud.bom)
    api libs.spring.cloud.starter.vault.config
    implementation libs.spring.boot.autoconfigure
    implementation libs.starter.validation // the properties are checked at startup

    integrationTestImplementation libs.testcontainers.core
    integrationTestImplementation libs.testcontainers.junit
    integrationTestImplementation libs.testcontainers.vault
}
