// The one version catalog (platform/gradle/libs.versions.toml), which every build reads directly,
// published as uz.heeypay.ecom:versioning for when the platform becomes its own repository.
plugins {
    id 'version-catalog'
    id 'maven-publish'
}

group = 'uz.heeypay.ecom'
version = libs.versions.ecom.platform.get()

catalog { versionCatalog { from(files('../gradle/libs.versions.toml')) } }

publishing {
    publications {
        catalog(MavenPublication) { from components.versionCatalog }
    }
}
