// The one version catalog. Every build reads libs.versions.toml directly; the catalog is also
// publishable for when the platform becomes its own repository.
plugins {
    id 'version-catalog'
    id 'maven-publish'
}

group = 'uz.heeypay.ecom'
version = '0.1.0'

catalog { versionCatalog { from(files('libs.versions.toml')) } }

publishing {
    publications {
        catalog(MavenPublication) { from components.versionCatalog }
    }
}
