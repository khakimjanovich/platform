# Every version in one place. Published to local Maven as uz.heeypay.ecom:versioning.
# Pinned exactly; upgrades get their own commit.
[versions]
temporal = "1.40.0"
standard-webhooks = "1.2.0"
http-message-signatures = "1.8"
java = "25"
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
openapi-generator = "7.14.0"
springdoc = "3.1.1"
lombok = "1.18.48"
shedlock = "7.10.1"
spotless = "8.10.4"
wiremock = "3.13.2"
aws-sdk = "2.54.0"
google-java-format = "1.30.0" # newer releases fail inside Spotless 8.10 (missing commonmark extension)
ecom-platform = "0.1.0"
opentelemetry-instrumentation = "2.28.1-alpha" # the release built on the OpenTelemetry Boot manages (1.62)

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-instrumentation" }
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
temporal-opentracing = { module = "io.temporal:temporal-opentracing", version.ref = "temporal" }
opentelemetry-opentracing-shim = { module = "io.opentelemetry:opentelemetry-opentracing-shim" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
standard-webhooks = { module = "com.standardwebhooks:standardwebhooks", version.ref = "standard-webhooks" }
http-message-signatures = { module = "com.authlete:http-message-signatures", version.ref = "http-message-signatures" }
starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-client" }
starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
postgresql = { module = "org.postgresql:postgresql" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
liquibase-core = { module = "org.liquibase:liquibase-core" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
modulith-core = { module = "org.springframework.modulith:spring-modulith-core" }
springdoc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
spring-web = { module = "org.springframework:spring-web" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api" }
spring-security-web = { module = "org.springframework.security:spring-security-web" }
spring-security-oauth2-client = { module = "org.springframework.security:spring-security-oauth2-client" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
jakarta-servlet = { module = "jakarta.servlet:jakarta.servlet-api" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind" }
ecom-partner-api = { module = "uz.heeypay.ecom:partner-api", version.ref = "ecom-platform" }
ecom-error = { module = "uz.heeypay.ecom:error", version.ref = "ecom-platform" }
ecom-otp = { module = "uz.heeypay.ecom:otp", version.ref = "ecom-platform" }
ecom-security = { module = "uz.heeypay.ecom:security", version.ref = "ecom-platform" }
ecom-keycloak = { module = "uz.heeypay.ecom:keycloak", version.ref = "ecom-platform" }
ecom-persistence = { module = "uz.heeypay.ecom:persistence", version.ref = "ecom-platform" }
ecom-crypto = { module = "uz.heeypay.ecom:crypto", version.ref = "ecom-platform" }
ecom-vault = { module = "uz.heeypay.ecom:vault", version.ref = "ecom-platform" }
ecom-observability = { module = "uz.heeypay.ecom:observability", version.ref = "ecom-platform" }
ecom-commission-api = { module = "uz.heeypay.ecom:commission-api", version.ref = "ecom-platform" }
ecom-epos-api = { module = "uz.heeypay.ecom:epos-api", version.ref = "ecom-platform" }
ecom-card-api = { module = "uz.heeypay.ecom:card-api", version.ref = "ecom-platform" }
ecom-bin-api = { module = "uz.heeypay.ecom:bin-api", version.ref = "ecom-platform" }
ecom-payment-api = { module = "uz.heeypay.ecom:payment-api", version.ref = "ecom-platform" }
ecom-uzcard-adapter-api = { module = "uz.heeypay.ecom:uzcard-adapter-api", version.ref = "ecom-platform" }
ecom-uzcard-adapter-client = { module = "uz.heeypay.ecom:uzcard-adapter-client", version.ref = "ecom-platform" }
ecom-humo-adapter-api = { module = "uz.heeypay.ecom:humo-adapter-api", version.ref = "ecom-platform" }
ecom-humo-adapter-client = { module = "uz.heeypay.ecom:humo-adapter-client", version.ref = "ecom-platform" }
ecom-file-store = { module = "uz.heeypay.ecom:file-store", version.ref = "ecom-platform" }

aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-s3 = { module = "software.amazon.awssdk:s3" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-jdbc = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }

openapi-generator-gradle = { module = "org.openapitools:openapi-generator-gradle-plugin", version.ref = "openapi-generator" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[bundles]
# A service's contract and its client, which is how other services call it.
uzcard-adapter-client = ["ecom-uzcard-adapter-api", "ecom-uzcard-adapter-client"]
humo-adapter-client = ["ecom-humo-adapter-api", "ecom-humo-adapter-client"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
